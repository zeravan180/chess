function gridMesh(nu,nv,fn,wrapU=false,auxFn=null){

function smoothNormals(pos,idx){const n=new Array(pos.length).fill(0);

    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2],vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];

  out.L=L;return out;}

function stripMesh(o0,o1,y0,y1,auxFn){return gridMesh(1,N,(u,v)=>{const p=TR[Math.round(v*N)%N],o=lerp(o0,o1,u);return[p.x+p.nx*o,lerp(y0,y1,u),p.z+p.nz*o];},false,(p,u,v)=>auxFn?auxFn(v*TL):0);}

function quadMesh(a,b,c,d,n=[0,1,0]){return{pos:[...a,...b,...c,...d],nrm:[...n,...n,...n,...n],aux:[0,0,0,0],idx:[0,1,2,0,2,3]};}
function cone(x,z,r,h,y0=0,seg=9,col){const pos=[],nrm=[],aux=[],idx=[];pos.push(x,y0+h,z);nrm.push(0,1,0);aux.push(col);
  for(let i=0;i<=seg;i++){const a=i/seg*Math.PI*2,c=Math.cos(a),s=Math.sin(a);pos.push(x+c*r,y0,z+s*r);const nn=norm3([c,r/h,s]);nrm.push(...nn);aux.push(col);}
  for(let i=0;i<seg;i++)idx.push(0,i+1,i+2);return{pos,nrm,aux,idx};}
function norm3(v){const l=hyp(...v);return v.map(x=>x/l);}

const TRK={};

  L.push(quadMesh([a.x-a.nx*w,0.012,a.z-a.nz*w],[a.x+a.nx*w,0.012,a.z+a.nz*w],[b.x+b.nx*w,0.012,b.z+b.nz*w],[b.x-b.nx*w,0.012,b.z-b.nz*w]));}return merge(L);})();
TRK.START=(()=>{const a=TR[0],b=TR[1];return quadMesh([a.x-a.nx*RH,0.014,a.z-a.nz*RH],[a.x+a.nx*RH,0.014,a.z+a.nz*RH],[b.x+b.nx*RH,0.014,b.z+b.nz*RH],[b.x-b.nx*RH,0.014,b.z-b.nz*RH]);})();
// scenery (aux = colour index)
const PAL_=[[0.05,0.18,0.06],[0.09,0.26,0.07],[0.25,0.15,0.07],[0.35,0.36,0.38],[0.6,0.6,0.62],[0.7,0.08,0.06],[0.05,0.15,0.5],[0.85,0.7,0.1],[0.3,0.34,0.24],[0.9,0.9,0.9]];
TRK.SCENE=(()=>{const L=[];let seed=7+CP.length*31;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const farFromTrack=(x,z,d)=>{for(let i=0;i<N;i+=3){if(hyp(TR[i].x-x,TR[i].z-z)<d)return false;}return true;};
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(const p of TR){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z)}const cx=(x0+x1)/2,cz=(z0+z1)/2,sx=x1-x0+300,sz=z1-z0+300;
  let n=0,tries=0;while(n<TH.trees&&tries++<20000){const x=cx+(R()-.5)*sx,z=cz+(R()-.5)*sz;if(!farFromTrack(x,z,RAIL+6))continue;

    else{const h=6+R()*8,r=2+R()*2;L.push(cone(x,z,0.4,h*0.35,0,5,2),cone(x,z,r,h*0.8,h*0.25,8,R()<.5?0:1));if(TH.snowcaps)L.push(cone(x,z,r*0.45,h*0.3,h*0.78,8,9));}n++;}

  if(TH.city){let b=0,t2=0;while(b<90&&t2++<20000){const x=cx+(R()-.5)*(sx+200),z=cz+(R()-.5)*(sz+200),w=8+R()*14,d=8+R()*14,h=10+R()*45;if(!farFromTrack(x,z,RAIL+8+Math.max(w,d)))continue;
    L.push(boxW(x-w/2,x+w/2,0,h,z-d/2,z+d/2,R()<.5?3:4));for(let yy=3;yy<h-2;yy+=3.2)for(let xx=-w/2+1.2;xx<w/2-1;xx+=2.4)if(R()<.45){L.push(boxW(x+xx,x+xx+1.1,yy,yy+1.5,z-d/2-0.05,z-d/2+0.02,10));L.push(boxW(x+xx,x+xx+1.1,yy,yy+1.5,z+d/2-0.02,z+d/2+0.05,10))}b++}
    // street lamps along the track
    for(let i=0;i<N;i+=22){const p=TR[i];for(const sd of[-1,1]){const lx=p.x+p.nx*sd*(RAIL+1.5),lz=p.z+p.nz*sd*(RAIL+1.5);L.push(boxW(lx-0.12,lx+0.12,0,6,lz-0.12,lz+0.12,3),boxW(lx-0.4,lx+0.4,6,6.3,lz-0.4,lz+0.4,10))}}}
  for(let i=0;i<36;i++){const a=i/36*Math.PI*2,d=900+R()*250,x=cx+Math.cos(a)*d,z=cz+Math.sin(a)*d;L.push(cone(x,z,180+R()*150,90+R()*120,0,10,8));}

  for(const dg of[0,10,22])for(const sd of[-1,1]){if(GS)break;for(let h=45;h>=12&&!GS;h-=3){for(const [z0,z1] of[[-h,h],[-h*1.4,h*0.6],[-h*1.8,h*0.2],[-h*2,0]]){if(clear(sd,z0,z1,dg)){GS={sd,z0,z1,dg};break}}}}

function progress(c){return c.laps*TL+TR[c.idx].s;}

  if(TOUCH){try{const d=document.documentElement,p=d.requestFullscreen?d.requestFullscreen():null;if(p&&p.then)p.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{});}catch(e){}}}

function update(dt){if(paused)return;
  if(state==='count'){countT=MODE==='net'?((NET.d&&NET.d.startAt||0)-now())/1000:countT-dt;const n=Math.ceil(countT);if(n<lastBeep&&n>0&&n<=3){beep(440,.2);lastBeep=n;}

    for(const c of cars){if(c.gone)continue;const sl=slipOf(c);if(sl>0.05&&hyp(c.x-(camEye?camEye[0]:0),c.z-(camEye?camEye[2]:0))<90&&Math.random()<sl*2.2){const f=[Math.sin(c.h),Math.cos(c.h)];

    fdb.ref('rcp/'+me).once('value',s=>{const v=parseInt(s.val())||0;if(v>PROG){PROG=Math.min(MAPS.length,v);try{localStorage.setItem('rc.prog',String(PROG))}catch(e){}drawLobby()}else if(PROG>v)fdb.ref('rcp/'+me).set(PROG).catch(()=>{})},()=>{});
    fdb.ref('profiles/'+me+'/private').on('value',s=>{const v=s.val()||{},o={};for(const k in RCSK.type)if(v[RCSK.type[k]])o[k]=v[RCSK.type[k]];if(v.rccus)o.cus=v.rccus;CNAME=typeof v.rcname==='string'?v.rcname.slice(0,12):'';try{localStorage.setItem('rc.cname',CNAME)}catch(e){}MY=RCSK.look(o);try{localStorage.setItem('rc.look',JSON.stringify(MY))}catch(e){}
      if(player&&MODE!=='net')player.sk=MY;drawLobby();if(NET.ref&&NET.d&&(NET.d.p||{})[me])NET.ref.child('p/'+me+'/sk').set(skNet()).catch(()=>{})},()=>{})})}catch(e){}}

// ================= online =================
// race/<code> = {host,status:wait|play,round,laps,bots,rnd,open,startAt,p:{uid:{name,photo,sk,j,slot,left}},c:{uid:{x,z,h,v,s,l,i,b,t,ts}},bt:{g:{...}}}
// every phone drives its own car and sends it 10 times a second; the host also drives the robots
const NET={code:null,ref:null,d:null,lastSend:0,lastBot:0,since2:0,made:0,startAt:0};let RND=null;
const nNew=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';for(let i=0;i<5;i++)x+=a[Math.floor(Math.random()*a.length)];return x};
const nMe=()=>({name:myName(),photo:myPhoto().length<1500?myPhoto():'',sk:skNet(),j:now()});
function drawOnline(){const box=$('online');if(!box)return;box.textContent='';const h=document.createElement('h2');h.textContent='🌐 '+t('online');box.append(h);
  const P=(tag,txt,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;box.append(e);return e};
  if(!fdb||!me){P('p',t('login'));return}
  const d=NET.d;
  if(!NET.code||!d){const b=P('button',t('random'),'btn');b.type='button';b.onclick=nRandom;P('p',t('randomD'));P('p',t('friends'));
    const mk=P('button',t('mkRoom'),'btn blue');mk.type='button';mk.onclick=nCreate;
    const r=P('div',null,'rowi'),inp=document.createElement('input');inp.id='code';inp.maxLength=5;inp.placeholder='ABCDE';inp.autocomplete='off';const j=document.createElement('button');j.type='button';j.className='btn';j.textContent=t('join');j.onclick=()=>{const v=(inp.value||'').trim().toUpperCase();if(v.length===5)nJoin(v)};r.append(inp,j);return}
  const ps=Object.entries(d.p||{}).sort((a,b)=>(a[1].j||0)-(b[1].j||0)),pl=P('div',null,'ppl');
  ps.forEach(([u,x])=>{const c=document.createElement('div'),im=document.createElement('img');im.alt='';im.src=face(x.photo,x.name);im.dataset.fr=u;im.style.borderColor=RCSK.css(RCSK.paints[RCSK.look(x.sk).paint].col);const n=document.createElement('span');n.textContent=x.name;c.append(im,n);pl.append(c)});
  if(d.rnd){P('div','🔍','dcode');const left=NET.startAt?Math.max(0,Math.ceil((NET.startAt-Date.now())/1000)):0;P('p',t('searching')+(left?' · '+t('startsIn')+' '+num(left):'')).style.textAlign='center'}
  else{P('div',NET.code,'dcode');if(ps.length<6){const sh=P('button',t('share'),'btn blue');sh.type='button';sh.onclick=nShare}
    if(d.host===me){const bb=P('button',(d.bots!==false?'✅ ':'⬜ ')+t('withBots'),'btn ghost');bb.type='button';bb.onclick=()=>NET.ref.child('bots').set(d.bots===false);
      const st=P('button',t('startNow')+' · 🔁 '+num(LAPS),'btn');st.type='button';st.onclick=nStart}else P('p',t('waitHost'))}
  if(!d.rnd&&TRACKS[MAP])P('p','🗺️ '+TRACKS[MAP].ic+' '+nm(TRACKS[MAP].name)+' · 🔁 '+num(LAPS));
  const lv=P('button',t('leave'),'btn ghost');lv.type='button';lv.onclick=nLeave}
async function nCreate(){try{const c=nNew();await fdb.ref('race/'+c).set({host:me,status:'wait',round:0,laps:LAPS,bots:true,createdAt:firebase.database.ServerValue.TIMESTAMP,p:{[me]:nMe()}});nOpen(c)}catch(e){toast('✖')}}
async function nJoin(c){try{const r=(await fdb.ref('race/'+c).once('value')).val();if(!r){toast(t('noRoom'));return}const ps=r.p||{};if(!ps[me]&&(Object.keys(ps).length>=6||r.status!=='wait')){toast(t('full'));return}
  if(!ps[me])await fdb.ref('race/'+c+'/p/'+me).set(nMe());nOpen(c)}catch(e){toast('✖')}}
function nShare(){const x=t('title')+' 🏁 '+NET.code;if(navigator.share)navigator.share({title:t('title'),text:x,url:location.origin+location.pathname}).catch(()=>{});else{try{navigator.clipboard.writeText(x)}catch(e){}toast(t('copied'))}}
async function findOpen(){const s=await fdb.ref('race').orderByChild('open').startAt(now()-60000).limitToFirst(10).once('value');const out=[];s.forEach(c=>{const v=c.val();if(v&&v.open&&v.host!==me&&v.status==='wait'&&Object.keys(v.p||{}).length<6)out.push([c.key,v.open])});return out.sort((a,b)=>a[1]-b[1])}
async function nRandom(){if(!fdb||!me)return;try{for(const[c]of await findOpen()){try{await fdb.ref('race/'+c+'/p/'+me).set(nMe());nOpen(c);return}catch(e){}}
  const c=nNew();await fdb.ref('race/'+c).set({host:me,status:'wait',round:0,laps:LAPS,bots:true,rnd:true,open:now(),createdAt:firebase.database.ServerValue.TIMESTAMP,p:{[me]:nMe()}});
  fdb.ref('race/'+c).onDisconnect().remove();NET.made=Date.now();NET.since2=0;nOpen(c);
  // while waiting: start 8 s after a second player comes, or after 20 s with robots; join an older waiting room if there is one
  clearInterval(RND);let tick=0;RND=setInterval(async()=>{const d=NET.d;if(!d||!d.rnd||NET.code!==c||d.status!=='wait'||d.host!==me){clearInterval(RND);NET.startAt=0;return}
    const n=Object.keys(d.p||{}).length;if(n>=2&&!NET.since2)NET.since2=Date.now();
    const at=n>=6?Date.now():n>=2?NET.since2+8000:NET.made+20000;NET.startAt=at;drawOnline();
    if(Date.now()>=at){clearInterval(RND);NET.startAt=0;nStart();return}
    if(++tick%4===0&&n<2){NET.ref.child('open').set(now()).catch(()=>{});for(const[o,ts]of await findOpen()){if(o!==c&&ts<(d.open||now())){clearInterval(RND);await nLeave();try{await fdb.ref('race/'+o+'/p/'+me).set(nMe());nOpen(o)}catch(e){nRandom()}return}}}},1000)}catch(e){toast('✖')}}
function nOpen(c){if(NET.ref)NET.ref.off();NET.code=c;NET.ref=fdb.ref('race/'+c);NET.ref.child('p/'+me+'/left').onDisconnect().set(true);
  NET.ref.on('value',s=>{const prev=NET.d;NET.d=s.val();const d=NET.d;
    if(!d){NET.code=null;NET.ref.off();NET.ref=null;if(MODE==='net'&&state!=='menu'){toast(t('noRoom'));for(const c of cars)if(c.bot&&c.remote)c.gone=true}drawOnline();return}
    if(d.status==='play'&&(!prev||prev.status!=='play'||prev.round!==d.round))nBegin(d);
    if(MODE==='net'&&state!=='menu')nSync(d);
    if(!$('lobby').hidden)drawOnline()})}
async function nLeave(){clearInterval(RND);NET.startAt=0;const d=NET.d,c=NET.code;if(NET.ref){NET.ref.child('p/'+me+'/left').onDisconnect().cancel();if(d&&d.rnd&&d.host===me)NET.ref.onDisconnect().cancel();NET.ref.off()}NET.ref=null;NET.code=null;NET.d=null;
  try{if(d&&d.host===me)await fdb.ref('race/'+c).remove();else if(c)await fdb.ref('race/'+c+'/p/'+me).remove()}catch(e){}if(MODE==='net'){MODE='bot'}drawOnline()}
function nStart(){const d=NET.d;if(!d||d.host!==me)return;const ps=Object.entries(d.p||{}).filter(([u,x])=>!x.left).sort((a,b)=>(a[1].j||0)-(b[1].j||0));
  const ks=Object.keys(TRACKS),up={status:'play',round:(d.round||0)+1,laps:d.rnd?3:LAPS,map:d.rnd?ks[Math.floor(Math.random()*Math.min(ks.length,PROG))]:MAP,startAt:now()+5000,c:null,bt:null,open:null};
  // places on the grid: people at the back so the robots are not all behind them
  const slots=d.bots===false?[0,1,2,3,4,5]:[5,4,3,2,1,0];ps.forEach(([u],i)=>{up['p/'+u+'/slot']=slots[i];up['p/'+u+'/left']=null});
  Object.keys(d.p||{}).forEach(u=>{if(d.p[u].left)up['p/'+u]=null});NET.ref.update(up)}
function nBegin(d){MODE='net';LAPS=d.laps||3;if(d.map&&d.map!==MAP&&TRACKS[d.map])buildTrack(d.map);ov.style.display='none';$('lobby').hidden=true;initAudio();cars=[];results=[];smoke=[];camEye=null;paused=false;lastBeep=4;raceT=0;
  const host=d.host===me,bySlot={};Object.entries(d.p||{}).forEach(([u,x])=>{if(x.slot!=null)bySlot[x.slot]=[u,x]});
  let seed=(d.round||1)*7919+13;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let g=0;g<6;g++){const hu=bySlot[g];let c;
    if(hu&&hu[0]===me)c=gridCar(g,{player:true,uid:me,name:myName(),sk:MY,acc:1,vm:1,skill:1});
    else if(hu)c=gridCar(g,{remote:true,uid:hu[0],name:hu[1].name||'?',sk:RCSK.look(hu[1].sk)});
    else if(d.bots!==false){const bl=botLook(r);c=gridCar(g,{bot:true,botId:g,remote:!host,name:BOTN[LI()][g],sk:bl,skill:.9+g*.012,vm:RCSK.bodies[bl.body].vmax})}
    else{r();continue}
    cars.push(c);if(c.player)player=c}
  state='count';countT=5}
function nSync(d){const cs=d.c||{},bt=d.bt||{};
  for(const c of cars){if(c.remote&&c.uid){const q=cs[c.uid],pp=(d.p||{})[c.uid];if(q)c.net=q;if(!pp||pp.left)c.gone=true}
    else if(c.remote&&c.bot){const q=bt[c.botId];if(q)c.net=q}}}
// a car from another phone glides toward where it should be now
function netCar(c,dt){const q=c.net;if(!q)return;const age=Math.min(.5,Math.max(0,(now()-(q.ts||now()))/1000)),tx=q.x+Math.sin(q.h)*q.v*age,tz=q.z+Math.cos(q.h)*q.v*age;
  if(hyp(tx-c.x,tz-c.z)>25){c.x=tx;c.z=tz;c.h=q.h}const k=1-Math.pow(.0008,dt);c.x+=(tx-c.x)*k;c.z+=(tz-c.z)*k;let dh=q.h-c.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));c.h+=dh*k;
  c.v=q.v;c.steer=q.s||0;c.brake=!!q.b;c.wheel+=c.v/WY*dt;c.idx=(q.i|0)%N;c.laps=q.l|0;
  const pp=TR[c.idx];c.lat=(c.x-pp.x)*pp.nx+(c.z-pp.z)*pp.nz;
  if(q.t>0&&!c.finished){c.finished=true;c.finishT=q.t;results.push(c);results.sort((a,b)=>a.finishT-b.finishT)}}
const pack=c=>({x:Math.round(c.x*100)/100,z:Math.round(c.z*100)/100,h:Math.round(c.h*1000)/1000,v:Math.round(c.v*10)/10,s:Math.round(c.steer*100)/100,l:c.laps,i:c.idx,b:c.brake?1:0,t:c.finished?Math.round(c.finishT*100)/100:0,ts:now()});
function netSend(force){if(!NET.ref||!player)return;const t0=performance.now();
  if(force||t0-NET.lastSend>100){NET.lastSend=t0;NET.ref.child('c/'+me).set(pack(player)).catch(()=>{})}
  if(NET.d&&NET.d.host===me&&t0-NET.lastBot>125){NET.lastBot=t0;const o={};for(const c of cars)if(c.bot&&!c.remote)o[c.botId]=pack(c);if(Object.keys(o).length)NET.ref.child('bt').set(o).catch(()=>{})}}

fbBoot();
makeCars();drawLobby();
let last=performance.now(),gf=0;
function loop(now){const dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);render.dt=dt;render();if(++gf%2===0)drawGarage();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
