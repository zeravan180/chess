<style>
/* Who is the spy? A party game on one phone, 3 to 12 players. Everyone sees the same word except the spy.
   The players ask each other questions, then vote. Four languages: Badini, Sorani, Arabic, English. */
:root{--gold:#facc15;--line:rgba(165,180,252,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0a24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif;overscroll-behavior:none}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;color:#fff}
#lobby,.scr{min-height:100vh;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;background:radial-gradient(ellipse at 50% 0,#2e2a7a,#0b0a24 70%)}
.scr{align-items:center;justify-content:flex-start;text-align:center}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px}
.top a,.top button{color:#fff;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.langs{margin-inline-start:auto;display:flex;gap:4px}.langs button{padding:6px 9px;font-size:12px}.langs button.on{background:#7c3aed;border-color:#a78bfa}
h1{margin:4px 0 0;text-align:center;font-size:30px}
.sub{margin:0;text-align:center;color:#c7d2fe;font-size:14px;line-height:1.6}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px;color:#e0e7ff;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.step{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;font-size:22px;font-weight:900;background:#4338ca}.step b{min-width:34px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid transparent;font-size:13px;font-weight:700}
.cat i{font-style:normal;font-size:26px}.cat.on{border-color:var(--gold);background:rgba(250,204,21,.14)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:9px 13px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:14px}.seg button.on{background:#7c3aed;border-color:#a78bfa}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.tog input{width:22px;height:22px;accent-color:#7c3aed}
.play{background:linear-gradient(#fde047,#eab308);color:#1e1b4b;font-weight:900;font-size:22px;padding:16px;box-shadow:0 6px 0 #a16207,0 10px 18px rgba(0,0,0,.4)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #a16207}
.btn{background:#7c3aed;padding:14px 26px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #4c1d95}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}
.btn.red{background:#dc2626;box-shadow:0 4px 0 #7f1d1d}
.big{font-size:22px;font-weight:900;margin-top:24px}
.hand{font-size:90px;margin-top:20px}
.flip{width:min(300px,86vw);height:390px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:20px;margin-top:10px;animation:pop .35s ease-out}
.flip.w{background:linear-gradient(#22c55e,#14532d)}.flip.s{background:linear-gradient(#dc2626,#450a0a)}
.flip .e{font-size:100px;line-height:1}.flip b{font-size:32px}.flip span{font-size:15px;opacity:.92;line-height:1.6}
.flip small{background:rgba(0,0,0,.25);border-radius:10px;padding:4px 10px;font-size:13px}
@keyframes pop{from{transform:scale(.6) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.timer{font-size:64px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:8px}.timer.warn{color:#f87171}
.tip{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.8;align-self:stretch}
.tip b{color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.pl{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px;border:2px solid transparent;text-align:start}
.pl i{font-style:normal;font-size:24px}.pl em{margin-inline-start:auto;font-style:normal;color:var(--gold);font-size:15px}
.pl.sel{border-color:#ef4444;background:rgba(239,68,68,.2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:stretch}
.opts button{padding:14px 8px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-weight:800;font-size:16px}
.opts button.good{border-color:#22c55e;background:rgba(34,197,94,.3)}.opts button.bad{border-color:#ef4444;background:rgba(239,68,68,.3)}
.res{font-size:30px;font-weight:900;margin-top:10px}.res.g{color:#4ade80}.res.s{color:#f87171}
.reveal{display:flex;gap:10px;align-self:stretch}.reveal div{flex:1;background:rgba(255,255,255,.07);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.reveal i{font-style:normal;font-size:40px}.reveal small{color:#c7d2fe}
.rules li{margin:6px 0;line-height:1.7}.rules{padding-inline-start:20px;margin:0;font-size:15px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#ov .card{background:#1e1b4b;max-width:440px;max-height:90vh;overflow:auto}
.gswitch{display:none}
</style>

// ---------- storage ----------
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const jget=(k,d)=>{try{const v=JSON.parse(ls(k));return v==null?d:v}catch(e){return d}};
let cfg=Object.assign({n:4,names:[],cat:"",min:5,spies:1,hint:true},jget("spy.cfg",{}));
let score=jget("spy.score",{});
const save=()=>{ls("spy.cfg",JSON.stringify(cfg));ls("spy.score",JSON.stringify(score))};
const $=id=>document.getElementById(id);
const FACES=["🙂","😎","🤓","😬","🙃","😇","🤠","🥸","😺","🦊","🐼","🐯"];

// ---------- sounds made in the browser (uses the app's sound setting ag.sfx) ----------
let AC=null;const sOn=()=>ls("ag.sfx")!=="0";
function tone(f,f2,d,type,v,delay){if(!sOn())return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
const sfx={tap:()=>tone(520,0,.06,"triangle",.1),flip:()=>{tone(300,600,.18,"sine",.12)},spy:()=>{tone(200,120,.4,"sawtooth",.08);tone(150,90,.5,"square",.04,.1)},
 win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,0,.2,"triangle",.14,i*.12))},lose:()=>{[392,330,262].forEach((f,i)=>tone(f,0,.25,"sawtooth",.07,i*.15))},tick:()=>tone(900,0,.03,"square",.05),
 alarm:()=>{[0,.25,.5].forEach(d=>tone(880,660,.2,"square",.08,d))}};
const vib=ms=>{try{if(ls("ag.vib")!=="0"&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}};

// ---------- lobby ----------
function txt(){document.documentElement.lang=L==="en"?"en":L==="ar"?"ar":"ku";document.documentElement.dir=L==="en"?"ltr":"rtl";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.title=t("title")+" · AG Classic Games"}
function pname(i){const v=(cfg.names[i]||"").trim();return v||t("player")+" "+num(i+1)}
function lobby(){txt();show("lobby");
  const lg=$("langs");lg.textContent="";LANGS.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=LBL[k];if(k===L)b.className="on";b.onclick=()=>{L=k;ls("lang",k);lobby()};lg.append(b)});
  $("pN").textContent=num(cfg.n);
  const nm=$("names");nm.textContent="";for(let i=0;i<cfg.n;i++){const inp=document.createElement("input");inp.maxLength=16;inp.placeholder=t("player")+" "+num(i+1);inp.value=cfg.names[i]||"";
    inp.oninput=()=>{cfg.names[i]=inp.value;save()};nm.append(inp)}
  const cs=$("cats");cs.textContent="";[""].concat(CK).forEach(k=>{const b=document.createElement("button");b.type="button";b.className="cat"+(cfg.cat===k?" on":"");
    b.innerHTML="<i></i><span></span>";b.querySelector("i").textContent=k?CATS[k][0]:"🎲";b.querySelector("span").textContent=k?cName(k):t("mixed");
    b.onclick=()=>{cfg.cat=k;save();sfx.tap();lobby()};cs.append(b)});
  seg("tSeg",[3,5,8],cfg.min,v=>num(v)+" "+t("min"),v=>{cfg.min=v});
  const maxS=cfg.n>=7?2:1;if(cfg.spies>maxS)cfg.spies=maxS;
  seg("sSeg",maxS>1?[1,2]:[1],cfg.spies,v=>"🕵️ "+num(v),v=>{cfg.spies=v});
  $("hintOn").checked=cfg.hint;
  const ks=Object.keys(score).filter(k=>score[k]>0).sort((a,b)=>score[b]-score[a]);$("scoreCard").hidden=!ks.length;
  const sl=$("scoreList");sl.textContent="";ks.forEach((k,i)=>{const d=document.createElement("div");d.className="pl";d.innerHTML="<i></i><b></b><em></em>";d.querySelector("i").textContent=["🥇","🥈","🥉"][i]||"⭐";d.querySelector("b").textContent=k;d.querySelector("em").textContent=num(score[k])+" "+t("pts");sl.append(d)});
  save()}
function seg(id,vals,cur,lab,set){const el=$(id);el.textContent="";vals.forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=lab(v);if(v===cur)b.className="on";b.onclick=()=>{set(v);save();sfx.tap();lobby()};el.append(b)})}
$("pMinus").onclick=()=>{if(cfg.n>3){cfg.n--;sfx.tap();lobby()}};
$("pPlus").onclick=()=>{if(cfg.n<12){cfg.n++;sfx.tap();lobby()}};
$("hintOn").onchange=e=>{cfg.hint=e.target.checked;save()};
$("scoreClr").onclick=()=>{score={};save();lobby()};
$("rulesBtn").onclick=()=>{const o=$("ov");o.hidden=false;o.innerHTML='<div class="card"><h2>📖 '+t("rules")+'</h2><ul class="rules"></ul><button class="btn" type="button">'+t("close")+'</button></div>';
  const ul=o.querySelector("ul");S.rulesList[LI()].forEach(x=>{const li=document.createElement("li");li.textContent=x;ul.append(li)});o.querySelector("button").onclick=()=>o.hidden=true};
function show(id){["lobby","pass","talk","vote","end"].forEach(k=>$(k).hidden=k!==id);scrollTo(0,0)}

// ---------- a round ----------
let R=null,timer=null;
const rnd=n=>Math.floor(Math.random()*n);
// don't give the same word again until most words have been used
function pickWord(){const pool=[];(cfg.cat?[cfg.cat]:CK).forEach(k=>CATS[k][2].forEach((w,i)=>pool.push([k,i])));
  let used=jget("spy.used",[]);let fresh=pool.filter(p=>!used.includes(p[0]+"."+p[1]));if(!fresh.length){used=[];fresh=pool}
  const p=fresh[rnd(fresh.length)];used.push(p[0]+"."+p[1]);if(used.length>400)used=used.slice(-400);ls("spy.used",JSON.stringify(used));return p}
$("go").onclick=()=>{sfx.tap();newRound()};
function newRound(){const n=cfg.n,names=[];for(let i=0;i<n;i++)names.push(pname(i));
  const[cat,wi]=pickWord(),spies=[];while(spies.length<cfg.spies){const s=rnd(n);if(!spies.includes(s))spies.push(s)}
  R={n,names,cat,wi,spies,i:0,first:rnd(n),left:cfg.min*60,paused:false,acc:-1};passScreen(false)}
const word=()=>CATS[R.cat][2][R.wi];
function passScreen(open){show("pass");const P=$("pass"),i=R.i;
  if(!open){P.innerHTML='<div class="top" style="align-self:stretch"><button type="button" id="pQuit"></button><span style="margin-inline-start:auto;color:#c7d2fe">'+num(i+1)+" / "+num(R.n)+'</span></div><div class="hand">📱</div><div class="big"></div><p class="sub"></p><button class="btn" type="button" id="pShow"></button>';
    P.querySelector(".big").textContent=t("giveTo")+" "+R.names[i];P.querySelector(".sub").textContent=t("noLook");$("pShow").textContent=t("show");
    $("pShow").onclick=()=>{sfx.flip();vib(30);passScreen(true)}}
  else{const spy=R.spies.includes(i),w=word();
    P.innerHTML='<div class="big" style="margin-top:6px"></div><div class="flip '+(spy?"s":"w")+'"><div class="e"></div><b></b><span></span><small></small></div><button class="btn" type="button" id="pHide"></button>';
    P.querySelector(".big").textContent=R.names[i];
    P.querySelector(".e").textContent=spy?"🕵️":w[0];P.querySelector("b").textContent=spy?t("youSpy"):wName(w);P.querySelector("span").textContent=spy?t("spyTxt"):t("remember");
    const sm=P.querySelector("small");if(spy&&!cfg.hint)sm.remove();else sm.textContent=t("topicIs")+CATS[R.cat][0]+" "+cName(R.cat);
    if(spy){sfx.spy();vib([60,40,60])}
    $("pHide").textContent=t("hide");$("pHide").onclick=()=>{sfx.tap();R.i++;if(R.i>=R.n)talkScreen();else passScreen(false)}}
  const q=$("pQuit");if(q){q.textContent=t("quit");q.onclick=quit}}
function quit(){clearInterval(timer);R=null;lobby()}
const mmss=s=>{const m=Math.floor(s/60),x=s%60;return num(m)+":"+num(String(x).padStart(2,"0"))};
function talkScreen(){show("talk");const P=$("talk");
  P.innerHTML='<div class="top" style="align-self:stretch"><button type="button" id="tQuit"></button></div><div class="big" style="margin-top:0"></div><div class="timer" id="clock"></div>'+
   '<div class="tip"><span></span><br><b id="firstN"></b></div><div class="tip" id="how"></div><div class="tip" id="ex" style="color:#c7d2fe;font-size:14px"></div>'+
   '<div style="display:flex;gap:10px"><button class="btn ghost" type="button" id="pz"></button><button class="btn red" type="button" id="toV"></button></div>';
  P.querySelector(".big").textContent=t("talkTitle");P.querySelector(".tip span").textContent=t("first");$("firstN").textContent=FACES[R.first%FACES.length]+" "+R.names[R.first];
  $("how").textContent=t("howTalk");$("ex").textContent=t("ex");$("toV").textContent=t("toVote");$("tQuit").textContent=t("quit");$("tQuit").onclick=quit;
  const pz=$("pz"),paint=()=>{const c=$("clock");if(!c)return;c.textContent=mmss(R.left);c.classList.toggle("warn",R.left<=30);pz.textContent=R.paused?t("resume"):t("pause")};
  pz.onclick=()=>{R.paused=!R.paused;sfx.tap();paint()};$("toV").onclick=()=>{sfx.tap();voteScreen()};
  clearInterval(timer);paint();
  timer=setInterval(()=>{if(R.paused)return;R.left--;if(R.left<=10&&R.left>0)sfx.tick();paint();if(R.left<=0){clearInterval(timer);sfx.alarm();vib([200,100,200]);voteScreen(true)}},1000)}
function voteScreen(up){clearInterval(timer);show("vote");const P=$("vote");
  P.innerHTML='<div class="big" style="margin-top:6px"></div><p class="sub"></p><div class="list" id="vl"></div><button class="btn red" type="button" id="acc" disabled style="opacity:.5"></button><button class="btn ghost" type="button" id="back"></button>';
  P.querySelector(".big").textContent=up?t("timeUp"):t("voteTitle");P.querySelector(".sub").textContent=t("voteHow");
  const vl=$("vl");R.names.forEach((nm,i)=>{const b=document.createElement("button");b.type="button";b.className="pl"+(R.acc===i?" sel":"");b.innerHTML="<i></i><b></b>";b.querySelector("i").textContent=FACES[i%FACES.length];b.querySelector("b").textContent=nm;
    b.onclick=()=>{R.acc=i;sfx.tap();[...vl.children].forEach((c,k)=>c.classList.toggle("sel",k===i));const a=$("acc");a.disabled=false;a.style.opacity=1};vl.append(b)});
  $("acc").textContent=t("accuse");$("acc").onclick=()=>{if(R.acc>=0)judge()};
  $("back").textContent="💬 "+mmss(Math.max(0,R.left));$("back").hidden=R.left<=0;$("back").onclick=()=>{sfx.tap();talkScreen()}}
function judge(){if(R.spies.includes(R.acc)){sfx.win();guessScreen(R.acc)}else{sfx.lose();endScreen(false,"wrong")}}
// the caught spy gets one guess among 8 words of the same topic
function guessScreen(s){show("end");const P=$("end"),list=CATS[R.cat][2],opts=[R.wi];
  while(opts.length<Math.min(8,list.length)){const k=rnd(list.length);if(!opts.includes(k))opts.push(k)}opts.sort(()=>Math.random()-.5);
  P.innerHTML='<div class="res g"></div><p class="sub" id="lc"></p><div class="big" style="margin-top:4px">🕵️ <span></span></div><div class="opts" id="go2"></div>';
  P.querySelector(".res").textContent=t("caught");$("lc").textContent=t("lastChance")+" "+R.names[s]+".";P.querySelector(".big span").textContent=t("guess");
  const g=$("go2");opts.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=list[k][0]+" "+wName(list[k]);
    b.onclick=()=>{[...g.children].forEach(x=>x.disabled=true);const ok=k===R.wi;b.classList.add(ok?"good":"bad");if(!ok)g.children[opts.indexOf(R.wi)].classList.add("good");
      ok?(sfx.spy(),vib([60,40,60])):sfx.win();setTimeout(()=>endScreen(!ok,ok?"guessed":"missed"),1400)};g.append(b)})}
function endScreen(playersWin,why){show("end");const P=$("end"),w=word(),spyN=R.spies.map(i=>R.names[i]).join(t("and"));
  if(playersWin){R.names.forEach((nm,i)=>{if(!R.spies.includes(i))score[nm]=(score[nm]||0)+1})}else R.spies.forEach(i=>{score[R.names[i]]=(score[R.names[i]]||0)+3});save();
  if(playersWin)sfx.win();else sfx.lose();
  P.innerHTML='<div class="res '+(playersWin?"g":"s")+'"></div><p class="sub" id="why"></p><div class="reveal"><div><small></small><i></i><b></b></div><div><small></small><i>🕵️</i><b></b></div></div><div class="list" id="sc"></div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" type="button" id="again"></button><button class="btn ghost" type="button" id="home"></button></div>';
  P.querySelector(".res").textContent=playersWin?t("pWin"):t("sWin");
  $("why").textContent=why==="wrong"?R.names[R.acc]+t("wasNot"):why==="guessed"?t("spyGuessed"):why==="missed"?t("spyMissed"):"";
  const rv=P.querySelectorAll(".reveal div");rv[0].querySelector("small").textContent=t("theWord");rv[0].querySelector("i").textContent=w[0];rv[0].querySelector("b").textContent=wName(w);
  rv[1].querySelector("small").textContent=t("theSpy");rv[1].querySelector("b").textContent=spyN;
  const sc=$("sc");R.names.slice().sort((a,b)=>(score[b]||0)-(score[a]||0)).forEach((nm,i)=>{const d=document.createElement("div");d.className="pl";d.innerHTML="<i></i><b></b><em></em>";d.querySelector("i").textContent=["🥇","🥈","🥉"][i]||"⭐";d.querySelector("b").textContent=nm;d.querySelector("em").textContent=num(score[nm]||0)+" "+t("pts");sc.append(d)});
  $("again").textContent=t("again");$("again").onclick=()=>{sfx.tap();newRound()};$("home").textContent=t("home");$("home").onclick=()=>{R=null;lobby()}}
lobby();
</script>
