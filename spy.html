<style>
/* Who is the spy? A party game on one phone, 3 to 12 players. Everyone sees the same word except the spy.
   The players ask each other questions, then vote. Four languages: Badini, Sorani, Arabic, English. */
:root{--gold:#facc15;--line:rgba(165,180,252,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0a24;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif;overscroll-behavior:none}
button,select,input{font:inherit}
button{cursor:pointer;border:0;border-radius:14px;color:#fff}
#lobby,.scr{min-height:100vh;padding:14px 16px 30px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;background:radial-gradient(ellipse at 50% 0,#2e2a7a,#0b0a24 70%)}
.scr{align-items:center;justify-content:flex-start;text-align:center}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px}
.top a,.top button{color:#fff;text-decoration:none;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.langs{margin-inline-start:auto;display:flex;gap:4px}.langs button{padding:6px 9px;font-size:12px}.langs button.on{background:#7c3aed;border-color:#a78bfa}
h1{margin:4px 0 0;text-align:center;font-size:30px}
.sub{margin:0;text-align:center;color:#c7d2fe;font-size:14px;line-height:1.6}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:16px;color:#e0e7ff;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.step{display:flex;align-items:center;gap:10px}.step button{width:42px;height:42px;font-size:22px;font-weight:900;background:#4338ca}.step b{min-width:34px;text-align:center;font-size:22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid transparent;font-size:13px;font-weight:700}
.cat i{font-style:normal;font-size:26px}.cat.on{border-color:var(--gold);background:rgba(250,204,21,.14)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:9px 13px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:14px}.seg button.on{background:#7c3aed;border-color:#a78bfa}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.tog input{width:22px;height:22px;accent-color:#7c3aed}
.play{background:linear-gradient(#fde047,#eab308);color:#1e1b4b;font-weight:900;font-size:22px;padding:16px;box-shadow:0 6px 0 #a16207,0 10px 18px rgba(0,0,0,.4)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 #a16207}
.btn{background:#7c3aed;padding:14px 26px;font-weight:800;font-size:17px;box-shadow:0 4px 0 #4c1d95}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}
.btn.red{background:#dc2626;box-shadow:0 4px 0 #7f1d1d}
.big{font-size:22px;font-weight:900;margin-top:24px}
.hand{font-size:90px;margin-top:20px}
.flip{width:min(300px,86vw);height:390px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:20px;margin-top:10px;animation:pop .35s ease-out}
.flip.w{background:linear-gradient(#22c55e,#14532d)}.flip.s{background:linear-gradient(#dc2626,#450a0a)}
.flip .e{font-size:100px;line-height:1}.flip b{font-size:32px}.flip span{font-size:15px;opacity:.92;line-height:1.6}
.flip small{background:rgba(0,0,0,.25);border-radius:10px;padding:4px 10px;font-size:13px}
@keyframes pop{from{transform:scale(.6) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.timer{direction:ltr;unicode-bidi:isolate;font-size:64px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:8px}.timer.warn{color:#f87171}
.tip{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.8;align-self:stretch}
.tip b{color:var(--gold)}
.list{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.pl{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-weight:700;font-size:17px;border:2px solid transparent;text-align:start}
.pl i{font-style:normal;font-size:24px}.pl em{margin-inline-start:auto;font-style:normal;color:var(--gold);font-size:15px}
.pl.sel{border-color:#ef4444;background:rgba(239,68,68,.2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:stretch}
.opts button{padding:14px 8px;background:rgba(255,255,255,.08);border:2px solid var(--line);font-weight:800;font-size:16px}
.opts button.good{border-color:#22c55e;background:rgba(34,197,94,.3)}.opts button.bad{border-color:#ef4444;background:rgba(239,68,68,.3)}
.res{font-size:30px;font-weight:900;margin-top:10px}.res.g{color:#4ade80}.res.s{color:#f87171}
.reveal{display:flex;gap:10px;align-self:stretch}.reveal div{flex:1;background:rgba(255,255,255,.07);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px}
.reveal i{font-style:normal;font-size:40px}.reveal small{color:#c7d2fe}
.rules li{margin:6px 0;line-height:1.7}.rules{padding-inline-start:20px;margin:0;font-size:15px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
#ov .card{background:#1e1b4b;max-width:440px;max-height:90vh;overflow:auto}
.gswitch{display:none}
.join{display:flex;gap:8px;align-self:stretch}.join input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font-size:16px}
#oCode{text-transform:uppercase;letter-spacing:4px;text-align:center;font-family:ui-monospace,monospace}
.codebox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:18px;background:linear-gradient(#5b21b6,#2e1065);align-self:stretch}
.codebox b{font-size:40px;letter-spacing:6px;font-family:ui-monospace,monospace}.codebox small{color:#ddd6fe}
.chat{align-self:stretch;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:10px}
.msgs{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;text-align:start}.chat.big .msgs{max-height:260px;min-height:120px}
.msg{background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px;font-size:14px;line-height:1.5;align-self:flex-start;max-width:90%}
.msg b{color:#a5b4fc;font-size:12px;display:block}.msg.mine{align-self:flex-end;background:rgba(124,58,237,.4)}
button.flip{color:#fff;cursor:pointer}.play:disabled{opacity:.5}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(30px);background:#111827;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<main id="lobby">
  <div class="top"><a href="./" id="tBack">↩ AG</a><div class="langs" id="langs"></div></div>
  <h1>🕵️ <span data-t="title"></span></h1>

  <section class="card">
    <h2>👥 <span data-t="players"></span></h2>

    <div class="names" id="names"></div>

  <section class="card">
    <h2>📚 <span data-t="topic"></span></h2>

  <section class="card">

  </section>

  <button class="play" type="button" id="go">▶ <span data-t="start"></span> · <span data-t="oneTag"></span></button>
  <button class="btn" type="button" id="goOn" style="background:linear-gradient(#0ea5e9,#1d4ed8);box-shadow:0 4px 0 #1e3a8a"><span data-t="online"></span></button>
  <button class="btn ghost" type="button" id="rulesBtn">📖 <span data-t="rules"></span></button>
  <section class="card" id="scoreCard" hidden><h2>🏆 <span data-t="score"></span><button class="btn ghost" type="button" id="scoreClr" style="margin-inline-start:auto;padding:6px 12px;font-size:13px" data-t="clear"></button></h2><div class="list" id="scoreList"></div></section>
  <nav class="gswitch" aria-label="یاری"></nav>
</main>

const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

// ---------- sounds made in the browser (uses the app's sound setting ag.sfx) ----------
let AC=null;const sOn=()=>ls("ag.sfx")!=="0";
function tone(f,f2,d,type,v,delay){if(!sOn())return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
const sfx={tap:()=>tone(520,0,.06,"triangle",.1),flip:()=>{tone(300,600,.18,"sine",.12)},spy:()=>{tone(200,120,.4,"sawtooth",.08);tone(150,90,.5,"square",.04,.1)},
 win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,0,.2,"triangle",.14,i*.12))},lose:()=>{[392,330,262].forEach((f,i)=>tone(f,0,.25,"sawtooth",.07,i*.15))},tick:()=>tone(900,0,.03,"square",.05),
 alarm:()=>{[0,.25,.5].forEach(d=>tone(880,660,.2,"square",.08,d))}};
const vib=ms=>{try{if(ls("ag.vib")!=="0"&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}};

// ---------- lobby ----------
function txt(){document.documentElement.lang=L==="en"?"en":L==="ar"?"ar":"ku";document.documentElement.dir=L==="en"?"ltr":"rtl";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));document.title=t("title")+" · AG Classic Games"}
function pname(i){const v=(cfg.names[i]||"").trim();return v||t("player")+" "+num(i+1)}
function lobby(){txt();show("lobby");
  const lg=$("langs");lg.textContent="";LANGS.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=LBL[k];if(k===L)b.className="on";b.onclick=()=>{L=k;ls("lang",k);lobby()};lg.append(b)});
  $("pN").textContent=num(cfg.n);
  const nm=$("names");nm.textContent="";for(let i=0;i<cfg.n;i++){const inp=document.createElement("input");inp.maxLength=16;inp.placeholder=t("player")+" "+num(i+1);inp.value=cfg.names[i]||"";
    inp.oninput=()=>{cfg.names[i]=inp.value;save()};nm.append(inp)}
  const cs=$("cats");cs.textContent="";[""].concat(CK).forEach(k=>{const b=document.createElement("button");b.type="button";b.className="cat"+(cfg.cat===k?" on":"");
    b.innerHTML="<i></i><span></span>";b.querySelector("i").textContent=k?CATS[k][0]:"🎲";b.querySelector("span").textContent=k?cName(k):t("mixed");
    b.onclick=()=>{cfg.cat=k;save();sfx.tap();lobby()};cs.append(b)});
  seg("tSeg",[3,5,8],cfg.min,v=>num(v)+" "+t("min"),v=>{cfg.min=v});
  const maxS=cfg.n>=7?2:1;if(cfg.spies>maxS)cfg.spies=maxS;
  seg("sSeg",maxS>1?[1,2]:[1],cfg.spies,v=>"🕵️ "+num(v),v=>{cfg.spies=v});
  $("hintOn").checked=cfg.hint;
  const ks=Object.keys(score).filter(k=>score[k]>0).sort((a,b)=>score[b]-score[a]);$("scoreCard").hidden=!ks.length;
  const sl=$("scoreList");sl.textContent="";ks.forEach((k,i)=>{const d=document.createElement("div");d.className="pl";d.innerHTML="<i></i><b></b><em></em>";d.querySelector("i").textContent=["🥇","🥈","🥉"][i]||"⭐";d.querySelector("b").textContent=k;d.querySelector("em").textContent=num(score[k])+" "+t("pts");sl.append(d)});
  save()}
function seg(id,vals,cur,lab,set){const el=$(id);el.textContent="";vals.forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=lab(v);if(v===cur)b.className="on";b.onclick=()=>{set(v);save();sfx.tap();lobby()};el.append(b)})}
$("pMinus").onclick=()=>{if(cfg.n>3){cfg.n--;sfx.tap();lobby()}};
$("pPlus").onclick=()=>{if(cfg.n<12){cfg.n++;sfx.tap();lobby()}};
$("hintOn").onchange=e=>{cfg.hint=e.target.checked;save()};
$("scoreClr").onclick=()=>{score={};save();lobby()};
$("rulesBtn").onclick=()=>{const o=$("ov");o.hidden=false;o.innerHTML='<div class="card"><h2>📖 '+t("rules")+'</h2><ul class="rules"></ul><button class="btn" type="button">'+t("close")+'</button></div>';

// ---------- a round ----------
let R=null,timer=null;
const rnd=n=>Math.floor(Math.random()*n);
// don't give the same word again until most words have been used
function pickWord(){const pool=[];(cfg.cat?[cfg.cat]:CK).forEach(k=>CATS[k][2].forEach((w,i)=>pool.push([k,i])));
  let used=jget("spy.used",[]);let fresh=pool.filter(p=>!used.includes(p[0]+"."+p[1]));if(!fresh.length){used=[];fresh=pool}
  const p=fresh[rnd(fresh.length)];used.push(p[0]+"."+p[1]);if(used.length>400)used=used.slice(-400);ls("spy.used",JSON.stringify(used));return p}
$("go").onclick=()=>{sfx.tap();newRound()};
function newRound(){const n=cfg.n,names=[];for(let i=0;i<n;i++)names.push(pname(i));
  const[cat,wi]=pickWord(),spies=[];while(spies.length<cfg.spies){const s=rnd(n);if(!spies.includes(s))spies.push(s)}
  R={n,names,cat,wi,spies,i:0,first:rnd(n),left:cfg.min*60,paused:false,acc:-1};passScreen(false)}
const word=()=>CATS[R.cat][2][R.wi];
function passScreen(open){show("pass");const P=$("pass"),i=R.i;
  if(!open){P.innerHTML='<div class="top" style="align-self:stretch"><button type="button" id="pQuit"></button><span style="margin-inline-start:auto;color:#c7d2fe">'+num(i+1)+" / "+num(R.n)+'</span></div><div class="hand">📱</div><div class="big"></div><p class="sub"></p><button class="btn" type="button" id="pShow"></button>';

    $("pShow").onclick=()=>{sfx.flip();vib(30);passScreen(true)}}

  oLive(d)}
const LANG_=()=>L;
function head(d){return'<div class="top" style="align-self:stretch"><button type="button" id="oQuit">🚪</button><span style="margin-inline-start:auto">🕵️ <b>'+O.code+'</b> · 👥 <span id="oCnt">'+num(onP(d).length)+'</span></span></div>'}
function plist(d,ids,fn){return ids.map(u=>'<div class="pl"><i>'+(u===d.host?"👑":"🙂")+'</i><b>'+esc(pn(d,u))+(u===me?" "+t("me"):"")+'</b>'+(fn?'<em>'+fn(u)+'</em>':"")+'</div>').join("")}
function draw(d,st,host,mine){const P=$("on");let h=head(d);
  if(host&&(d.players||{})[d.host]&&!(d.players[d.host]||{}).on){}
  if(st==="lobby"){
    h+='<div class="codebox"><small>'+t("roomCode")+'</small><b>'+O.code+'</b><button class="btn ghost" type="button" id="oShare">'+t("share")+'</button></div>';
    if(host){h+='<div class="card" style="align-self:stretch;text-align:start"><div class="cats" id="oCats"></div><div class="row"><span>'+t("time")+'</span><div class="seg" id="oMin"></div></div>'+
        '<div class="row"><span>'+t("spies")+'</span><div class="seg" id="oNsp"></div></div><label class="tog"><span>'+t("hint")+'</span><input type="checkbox" id="oHint"'+(d.hint?" checked":"")+'></label></div>'+
        '<button class="play" type="button" id="oStart" style="align-self:stretch"'+(onP(d).length<3?" disabled":"")+'>▶ '+t("start")+'</button>'+(onP(d).length<3?'<p class="sub">'+t("need3")+'</p>':"")}
    else h+='<p class="sub">'+t("waitHost")+'</p>';
    h+='<div class="list">'+plist(d,onP(d).map(x=>x[0]))+'</div>'+chatBox();P.innerHTML=h;
    if(host){const cs=$("oCats");[""].concat(CK).forEach(k=>{const b=document.createElement("button");b.type="button";b.className="cat"+((d.cat||"")===k?" on":"");b.innerHTML="<i></i><span></span>";
        b.querySelector("i").textContent=k?CATS[k][0]:"🎲";b.querySelector("span").textContent=k?cName(k):t("mixed");b.onclick=()=>O.ref.update({cat:k});cs.append(b)});
      oSeg("oMin",[3,5,8],d.min||5,v=>num(v)+" "+t("min"),v=>O.ref.update({min:v}));
      const mx=onP(d).length>=7?2:1;oSeg("oNsp",mx>1?[1,2]:[1],Math.min(d.nsp||1,mx),v=>"🕵️ "+num(v),v=>O.ref.update({nsp:v}));
      $("oHint").onchange=e=>O.ref.update({hint:e.target.checked});$("oStart").onclick=()=>oStart()}
    $("oShare").onclick=()=>{const x=t("shareTxt")+O.code;if(navigator.share)navigator.share({title:"AG · "+t("title"),text:x,url:location.origin+location.pathname}).catch(()=>{});else{try{navigator.clipboard.writeText(x)}catch(e){}toast(t("copied"))}}}
  else if(!mine&&st!=="over"){h+='<div class="hand">⏳</div><p class="sub">'+t("notIn")+'</p>'+chatBox();P.innerHTML=h}
  else if(st==="card"){const spy=isSpy(d,me),w=oWord(d),seen=(d.seen||{})[me];
    if(!O.peek)h+='<button type="button" class="flip" id="oPeek" style="background:linear-gradient(#4338ca,#1e1b4b);border:0"><div class="e">🎴</div><span>'+t("tapSee")+'</span></button>';
    else h+='<div class="flip '+(spy?"s":"w")+'"><div class="e">'+(spy?"🕵️":w[0])+'</div><b>'+esc(spy?t("youSpy"):wName(w))+'</b><span>'+esc(spy?t("spyTxt"):t("remember"))+'</span>'+(spy&&!d.hint?"":'<small>'+esc(t("topicIs")+CATS[d.cat][0]+" "+cName(d.cat))+'</small>')+'</div>';
    h+=seen?'<p class="sub">'+t("waitOthers")+'</p>':(O.peek?'<button class="btn" type="button" id="oSeen">'+t("seenBtn")+'</button>':"");
    h+='<p class="sub" id="oSeenN"></p>';P.innerHTML=h;
    const pk=$("oPeek");if(pk)pk.onclick=()=>{O.peek=true;sfx.flip();vib(30);if(spy){sfx.spy();vib([60,40,60])}oRender()};
    const sb=$("oSeen");if(sb)sb.onclick=()=>{sfx.tap();O.ref.child("seen/"+me).set(true).catch(()=>{})}}
  else if(st==="talk"){h+='<div class="timer" id="oClock"></div><div class="tip"><span>'+t("first")+'</span> <b>'+esc(pn(d,d.first))+'</b></div>'+
      '<button class="btn ghost" type="button" id="oMy">'+t("myWord")+'</button><div id="oMyW" class="tip" hidden></div>'+chatBox(true)+(host?'<button class="btn red" type="button" id="oVote">'+t("voteNow")+'</button>':"");
    P.innerHTML=h;const w=oWord(d),spy=isSpy(d,me);
    $("oMy").onclick=()=>{const e=$("oMyW");e.hidden=!e.hidden;e.textContent=spy?"🕵️ "+t("youSpy")+(d.hint?" · "+t("topicIs")+cName(d.cat):""):w[0]+" "+wName(w)};
    if(host)$("oVote").onclick=()=>toVote()}
  else if(st==="vote"){const my=(d.votes||{})[me];h+='<div class="big" style="margin-top:0">'+t("voteTitle")+'</div><div class="timer" id="oClock" style="font-size:40px"></div><p class="sub">'+(my?t("yourVote"):t("voteSecret"))+'</p><div class="list" id="oVl"></div><p class="sub" id="oVn"></p>'+chatBox(true);
    P.innerHTML=h;const vl=$("oVl");inRound(d).filter(u=>u!==me).forEach(u=>{const b=document.createElement("button");b.type="button";b.className="pl"+(my===u?" sel":"");b.innerHTML="<i>🙂</i><b></b>";b.querySelector("b").textContent=pn(d,u);
      if(!my)b.onclick=()=>{sfx.tap();O.ref.child("votes/"+me).set(u).catch(()=>{})};else b.disabled=true;vl.append(b)})}
  else if(st==="guess"){const list=CATS[d.cat][2],opts=Object.values(d.opts||{});
    if(d.acc===me&&d.guess==null){h+='<div class="res g" style="font-size:22px">'+t("youCaught")+'</div><div class="opts" id="oG"></div>';P.innerHTML=h;const g=$("oG");
      opts.forEach(k=>{const b=document.createElement("button");b.type="button";b.textContent=list[k][0]+" "+wName(list[k]);b.onclick=()=>{[...g.children].forEach(x=>x.disabled=true);sfx.tap();O.ref.child("guess").set(k).catch(()=>{})};g.append(b)})}
    else{h+='<div class="hand">🕵️</div><p class="big" style="font-size:19px">'+t("spyGuessing")+'</p><p class="sub">'+esc(pn(d,d.acc))+'</p>'+chatBox(true);P.innerHTML=h}}
  else if(st==="over"){const r=d.result||{},w=oWord(d),pw=r.win==="p",sp=Object.keys(d.spies||{}),votes=d.votes||{},cnt={};Object.values(votes).forEach(u=>cnt[u]=(cnt[u]||0)+1);
    const why=r.why==="wrong"?esc(pn(d,r.acc))+t("wasNot"):r.why==="tie"?t("tie"):r.why==="guessed"?t("spyGuessed"):r.why==="missed"?t("spyMissed"):"";
    h+='<div class="res '+(pw?"g":"s")+'">'+(pw?t("pWin"):t("sWin"))+'</div><p class="sub">'+why+'</p>'+
      '<div class="reveal"><div><small>'+t("theWord")+'</small><i>'+w[0]+'</i><b>'+esc(wName(w))+'</b></div><div><small>'+t("theSpy")+'</small><i>🕵️</i><b>'+esc(sp.map(u=>pn(d,u)).join(t("and")))+'</b></div></div>';
    const sc=d.score||{},ids=Object.keys(d.players||{}).sort((a,b)=>(sc[b]||0)-(sc[a]||0));
    h+='<div class="list">'+ids.map((u,i)=>'<div class="pl'+(u===me?" sel":"")+'" style="'+(u===me?"border-color:#a78bfa;background:rgba(124,58,237,.3)":"")+'"><i>'+(["🥇","🥈","🥉"][i]||"⭐")+'</i><b>'+esc(pn(d,u))+(isSpy(d,u)?" 🕵️":"")+'</b><small style="color:#c7d2fe">🗳 '+num(cnt[u]||0)+'</small><em>'+num(sc[u]||0)+" "+t("pts")+'</em></div>').join("")+'</div>';
    if(host)h+='<div style="display:flex;gap:10px"><button class="btn" type="button" id="oNext">'+t("next")+'</button><button class="btn ghost" type="button" id="oLob">'+t("toLobby")+'</button></div>';else h+='<p class="sub">'+t("waitHost")+'</p>';
    h+=chatBox();P.innerHTML=h;if(host){$("oNext").onclick=()=>oStart();$("oLob").onclick=()=>O.ref.update({status:"lobby"})}
    if(O.endSnd!==d.round){O.endSnd=d.round;const iWon=isSpy(d,me)?!pw:pw;iWon?sfx.win():sfx.lose()}}
  const q=$("oQuit");if(q)q.onclick=()=>oLeave();
  const ci=$("oChatIn");if(ci){const go=()=>{const x=ci.value.trim().slice(0,120);if(!x)return;ci.value="";O.ref.child("chat").push({u:me,n:myName(),x,t:TS()}).catch(()=>{})};$("oChatGo").onclick=go;ci.onkeydown=e=>{if(e.key==="Enter")go()}}}
function oSeg(id,vals,cur,lab,set){const el=$(id);vals.forEach(v=>{const b=document.createElement("button");b.type="button";b.textContent=lab(v);if(v===cur)b.className="on";b.onclick=()=>set(v);el.append(b)})}
function chatBox(big){return'<div class="chat'+(big?" big":"")+'"><div class="msgs" id="oMsgs"></div><div class="join"><input id="oChatIn" maxlength="120" autocomplete="off" placeholder="'+esc(t("chatPh"))+'"><button class="btn" type="button" id="oChatGo">'+t("send")+'</button></div></div>'}
// the parts that change every second: clock, counters, chat
function oLive(d){const c=$("oCnt");if(c)c.textContent=num(onP(d).length);
  const ck=$("oClock");if(ck){const end=d.status==="talk"?d.endAt:d.voteEnd,left=Math.max(0,Math.ceil(((end||0)-srvNow())/1000));ck.textContent=mmss(left);ck.classList.toggle("warn",left<=30)}
  const sn=$("oSeenN");if(sn)sn.textContent=t("seenN")+num(Object.keys(d.seen||{}).length)+" / "+num(inRound(d).length);
  const vn=$("oVn");if(vn)vn.textContent=t("voted")+num(Object.keys(d.votes||{}).length)+" / "+num(inRound(d).length);
  const m=$("oMsgs");if(m){const all=Object.values(d.chat||{}).filter(x=>x&&x.x).sort((a,b)=>(a.t||0)-(b.t||0)).slice(-60);
    if(all.length!==O.chatN){const neu=O.chatN>=0&&all.length>O.chatN;O.chatN=all.length;m.textContent="";
      all.forEach(x=>{const r=document.createElement("div");r.className="msg"+(x.u===me?" mine":"");const b=document.createElement("b");b.textContent=x.n||"";const s=document.createElement("span");s.textContent=x.x;r.append(b,s);m.append(r)});
      m.scrollTop=m.scrollHeight;if(neu)sfx.tick()}}}

// ---------- the host's phone moves the game on ----------
function oStart(){const d=O.d;if(!d||d.host!==me)return;const ids=onP(d).map(x=>x[0]);if(ids.length<3){toast(t("need3"));return}
  const keep=cfg.cat;cfg.cat=d.cat||"";const[cat,wi]=pickWord();cfg.cat=keep;
  const n=Math.min(ids.length>=7?2:1,d.nsp||1),spies={};while(Object.keys(spies).length<n)spies[ids[rnd(ids.length)]]=true;
  O.peek=false;O.ref.update({status:"card",round:(d.round||0)+1,order:ids,cat,wi,spies,first:ids[rnd(ids.length)],seen:null,votes:null,guess:null,acc:null,opts:null,result:null,chat:null,endAt:null,voteEnd:null})}
function toVote(){const d=O.d;if(!d||d.host!==me||d.status!=="talk")return;O.ref.update({status:"vote",voteEnd:srvNow()+60000})}
function finish(win,why,acc){const d=O.d,up={status:"over",result:{win,why,acc:acc||null}},sc=Object.assign({},d.score||{});
  inRound(d).forEach(u=>{const spy=isSpy(d,u);if(win==="p"&&!spy)sc[u]=(sc[u]||0)+1;if(win==="s"&&spy)sc[u]=(sc[u]||0)+3});up.score=sc;O.ref.update(up)}
let hostBusy=0;
function oTick(){const d=O.d;if(!d)return;oLive(d);if(d.host!==me)return;if(Date.now()-hostBusy<1500)return;
  const now=srvNow(),ids=inRound(d),live=ids.filter(u=>((d.players||{})[u]||{}).on);
  if(d.status==="card"){if(live.length&&live.every(u=>(d.seen||{})[u])){hostBusy=Date.now();O.ref.update({status:"talk",endAt:now+(d.min||5)*60000})}}
  else if(d.status==="talk"){if(d.endAt&&now>=d.endAt){hostBusy=Date.now();sfx.alarm();toVote()}}
  else if(d.status==="vote"){const v=d.votes||{},all=live.every(u=>v[u]);
    if(all||(d.voteEnd&&now>=d.voteEnd)){hostBusy=Date.now();const cnt={};Object.values(v).forEach(u=>cnt[u]=(cnt[u]||0)+1);
      const best=Math.max(0,...Object.values(cnt)),top=Object.keys(cnt).filter(u=>cnt[u]===best);
      if(!best||top.length>1){finish("s","tie");return}const acc=top[0];
      if(!isSpy(d,acc)){finish("s","wrong",acc);return}
      const list=CATS[d.cat][2],opts=[d.wi];while(opts.length<Math.min(8,list.length)){const k=rnd(list.length);if(!opts.includes(k))opts.push(k)}opts.sort(()=>Math.random()-.5);
      O.ref.update({status:"guess",acc,opts,guessEnd:now+40000})}}
  else if(d.status==="guess"){if(d.guess!=null){hostBusy=Date.now();finish(d.guess===d.wi?"s":"p",d.guess===d.wi?"guessed":"missed")}
    else if(d.guessEnd&&now>=d.guessEnd||!((d.players||{})[d.acc]||{}).on){hostBusy=Date.now();finish("p","missed")}}}

$("goOn").onclick=()=>{sfx.tap();openOnline()};
fbBoot();lobby();
</script>
