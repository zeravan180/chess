<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دۆمینۆ ئۆنلاین</title>

<style>
/* Layout: one narrow column: seats, the line of tiles on a felt table, then my hand */
:root{
  --bg:#eef1f0; --panel:#ffffff; --fg:#1d2624; --muted:#5f6d6a; --line:#d5dcda;
  --accent:#c8862a; --accent-fg:#ffffff; --bad:#c94a3c; --good:#2f9e63;
  --felt:#1f5c4f; --felt2:#174a40; --tile:#fbf8f0; --tile-edge:#cfc6b2; --pip:#1d1a16; --t0:#3b82c4; --t1:#c8862a;
  --f-ui:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b1a; --panel:#1d2624; --fg:#e6ecea; --muted:#9aa9a5; --line:#2e3a37;
  --accent:#e0a04a; --accent-fg:#1a1208; --bad:#e06a5b; --good:#4cc286;
  --felt:#163f37; --felt2:#0f302a; --tile:#f1ece0; --tile-edge:#bdb39c; --pip:#1d1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1a; --panel:#1d2624; --fg:#e6ecea; --muted:#9aa9a5; --line:#2e3a37;
  --accent:#e0a04a; --accent-fg:#1a1208; --bad:#e06a5b; --good:#4cc286;
  --felt:#163f37; --felt2:#0f302a; --tile:#f1ece0; --tile-edge:#bdb39c; --pip:#1d1a16; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
h2{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
button,a.btn{font:inherit;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);color:var(--accent-fg)}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.big{font-size:17px;padding:14px 22px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
input{font:inherit;font-family:var(--f-mono);letter-spacing:.15em;text-transform:uppercase;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:9em;direction:ltr;text-align:center}
.seg{display:grid;gap:6px}
.seg.c2{grid-template-columns:repeat(2,1fr)} .seg.c3{grid-template-columns:repeat(3,1fr)}
.seg button{background:var(--bg);color:var(--fg);border:1px solid var(--line);flex-direction:column;gap:0;padding:10px 6px;line-height:1.35}
.seg button small{font-weight:400;color:var(--muted);font-size:11px}
.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.seg button.on small{color:inherit;opacity:.85}
.me-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.me-chip img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.ag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.code{font-family:var(--f-mono);font-size:28px;letter-spacing:.2em;direction:ltr;color:var(--accent)}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seat{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0;position:relative}
.seat img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.seat .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.seat .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.seat .nm span{font-size:12px;color:var(--muted)}
.seat.turn{border:2px solid var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.seat.t0{border-inline-start:5px solid var(--t0)} .seat.t1{border-inline-start:5px solid var(--t1)}
.seat.off{opacity:.55}
.backs{display:flex;gap:2px;direction:ltr}
.backs i{width:7px;height:13px;border-radius:2px;background:var(--felt);display:block}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.pill.turn{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pill.bad{background:var(--bad);color:#fff;border-color:transparent}
.pill.good{background:var(--good);color:#fff;border-color:transparent}
.table{background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%);border-radius:18px;padding:12px;margin-inline:-8px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 0 0 5px var(--rim,transparent)}
#game.wood .table{background:repeating-linear-gradient(8deg,rgba(0,0,0,.08) 0 3px,transparent 3px 14px),radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%)}
#game.stars .table{background:radial-gradient(1.5px 1.5px at 12% 20%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 40% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 64%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 25% 88%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 40%,#fff 50%,transparent 51%),radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%)}
.ends{display:flex;justify-content:space-between;align-items:center;color:#e9f2ee;font-size:13px;direction:ltr}
.ends b{font-family:var(--f-mono);font-size:18px;background:rgba(0,0,0,.25);padding:0 10px;border-radius:6px}
.chain{direction:ltr;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;min-height:min(62vh,420px);padding:10px 4px}
.crow{display:flex;align-items:center;gap:3px;justify-content:flex-start}
.crow.rev{flex-direction:row-reverse}
.chain .empty{color:#cfe2dc;font-size:13px;margin:auto;direction:rtl}
.tile{display:block;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tile rect.f{fill:var(--tile);stroke:var(--tile-edge);stroke-width:1.5}
.tile line{stroke:var(--tile-edge);stroke-width:1.6}
.tile circle{fill:var(--pip)}
.tile circle.p1{fill:var(--p1,var(--pip))}.tile circle.p2{fill:var(--p2,var(--pip))}.tile circle.p3{fill:var(--p3,var(--pip))}
.tile circle.p4{fill:var(--p4,var(--pip))}.tile circle.p5{fill:var(--p5,var(--pip))}.tile circle.p6{fill:var(--p6,var(--pip))}
/* walnut: wooden tiles, inlaid coloured pips, brass bar */
#game.walnut .tile rect.f{fill:url(#walnutGrad);stroke:#2a170b;stroke-width:2}
#game.walnut .tile rect.grain{fill:url(#walnutGrain);pointer-events:none}
#game.walnut .tile line{stroke:#c9a54a;stroke-width:5;stroke-linecap:round}
#game.walnut .tile circle{stroke:rgba(0,0,0,.55);stroke-width:2.5}
#game.walnut .tile{filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
/* gold & diamonds: polished gold tiles, sparkling gem pips, glowing table */
#game.goldlux .tile rect.f{fill:url(#goldGrad);stroke:#7a5418;stroke-width:2.5}
#game.goldlux .tile rect.shine{fill:url(#goldShine);pointer-events:none}
#game.goldlux .tile line{stroke:#6e4a12;stroke-width:4;stroke-linecap:round}
#game.goldlux .tile circle{fill:url(#gemGrad);stroke:#8a6420;stroke-width:2}
#game.goldlux .tile path.spk{fill:#fffbe8;transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
#game.goldlux .tile{filter:drop-shadow(0 0 5px rgba(255,205,110,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.5))}
#game.goldlux .table{position:relative;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),0 0 0 4px #ffe6a8,0 0 24px 6px rgba(255,210,130,.75);animation:rimGlow 2.6s ease-in-out infinite}
#game.goldlux .table::after{content:"";position:absolute;inset:7px;border-radius:13px;border:2px solid rgba(255,238,195,.95);box-shadow:0 0 12px 2px rgba(255,214,140,.85),inset 0 0 12px rgba(255,214,140,.5);pointer-events:none;animation:rimGlow 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9}}
@keyframes rimGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.tile.new rect.f{fill:#fff3cf}
.score{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#e9f2ee}
.score b{font-family:var(--f-mono)}
.hand{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:4px 0}
.hand button{padding:0;background:none;border-radius:8px;transition:transform .12s}
.hand button.ok{box-shadow:0 0 0 3px var(--accent);transform:translateY(-4px)}
.hand button:disabled{opacity:.55}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.side{display:flex;gap:8px}
.side button{flex:1}
.over{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.over .big-msg{font-size:22px;font-weight:800}
.reveal{display:flex;flex-direction:column;gap:6px;width:100%}
.reveal .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;direction:rtl}
.reveal .r .hand{justify-content:flex-start;padding:0}
/* ---- arcade lobby ---- */
.arcade{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 22px;border-radius:0 0 22px 22px;
  background:radial-gradient(ellipse at 50% 0%,#5fd39a 0%,#1f9a68 38%,#0f6b48 100%);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.arcade::before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.logo-svg{width:min(320px,86%);height:auto}
.logo-ku{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:-6px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:relative}
.cards.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;border-radius:16px;padding:8px 6px 10px;color:#fff;text-decoration:none;
  font-weight:800;border:0;cursor:pointer;min-width:0;box-shadow:0 6px 0 var(--cs),0 10px 18px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .1s}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cs),0 4px 10px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.card .art{display:block;width:100%;aspect-ratio:4/3}
.cards.small .card .art{aspect-ratio:1/1;width:78%}
.card .ct{font-size:clamp(14px,4.4vw,19px);text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.cards.small .card .ct{font-size:clamp(12px,3.6vw,15px)}
.c-blue{background:linear-gradient(160deg,#5fe0ff,#139fd6);--cs:#0b6d96}
.c-purple{background:linear-gradient(160deg,#b9a2f2,#7c5bd6);--cs:#523a9e}
.c-yellow{background:linear-gradient(160deg,#ffd84d,#f2a90b);--cs:#b67600}
.c-green{background:linear-gradient(160deg,#a6e85a,#55b52a);--cs:#36801a}
.c-red{background:linear-gradient(160deg,#ff9a86,#e8584a);--cs:#a8352b}
.join-row{display:flex;gap:8px;justify-content:center;position:relative;flex-wrap:wrap}
.join-row input{background:rgba(255,255,255,.92);color:#123;border:0}
.sheet-back{position:fixed;inset:0;background:rgba(10,15,14,.55);z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:12px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.clock{display:flex;flex-direction:column;gap:4px}
.clock .ct{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.clock .ct b{font-family:var(--f-mono);font-size:20px;min-width:2ch;text-align:center}
.clock .track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.clock .track i{display:block;height:100%;background:var(--muted);border-radius:inherit;transition:width .25s linear}
.clock.mine .track i{background:var(--accent)}
.clock.warn .track i{background:var(--bad)} .clock.warn .ct b{color:var(--bad)}
.voice{display:flex;gap:8px;align-items:stretch}
.mic{flex:1;background:var(--good);color:#fff;font-size:16px;padding:14px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.mic.rec{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 35%,transparent)}
@media (prefers-reduced-motion:no-preference){.mic.rec{animation:pulse 1s infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--bad) 10%,transparent)}}
.seat .talk{position:absolute;top:-8px;inset-inline-end:-6px;font-size:18px}
.coin{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#ffd23f;color:#3a2a00}
.stake{position:relative;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.stake span{background:rgba(0,0,0,.22);padding:4px 12px;border-radius:999px}
.coin-res{font-size:18px;font-weight:800}
.coin-res.up{color:var(--good)} .coin-res.down{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){.hand button{transition:none}.chain{scroll-behavior:auto}}

/* ===== game-lobby look: green glow, candy buttons, top bar, bottom nav ===== */
html:root:not([data-zz]){
  --bg:rgba(0,0,0,.22); --panel:rgba(6,62,40,.62); --fg:#ffffff; --muted:#b8e6cd; --line:rgba(255,255,255,.17);
  --accent:#ffc928; --accent-fg:#4a2c00; --hl:rgba(255,201,40,.45); --check:#ff5d4d; --bad:#ff6b5b; --good:#3fd17f;
  color-scheme:dark}
html{background:#074a2f}
body{margin:0}
body[data-view=game] .tb-ic{display:none}
.stat span{white-space:nowrap;font-size:11.5px}
body{background:transparent;position:relative;padding-top:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1.5px 1.5px at 18% 22%,rgba(255,255,255,.8) 50%,transparent 51%),radial-gradient(1px 1px at 78% 14%,rgba(255,255,255,.7) 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 64% 38%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.5) 50%,transparent 51%),
  radial-gradient(1px 1px at 86% 70%,rgba(255,255,255,.5) 50%,transparent 51%),

body.has-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),var(--panel);border:1px solid var(--line);border-radius:16px;

.tb-pill .plus{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:900 18px/1 Arial,sans-serif;font-style:normal;color:#7a4a00;

.tb-ic{flex:none;width:36px;height:36px;padding:0;background:none;border:0;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tb-ic:active,.tb-pill:active,.tb-av:active{transform:scale(.94)}
/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:16;display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;
  padding:4px 6px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#13915f,#0a5a3b);
  border-top:2px solid rgba(255,255,255,.18);border-radius:22px 22px 0 0;box-shadow:0 -8px 18px rgba(0,0,0,.25)}
.bnav>*{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;padding:0;color:#fff;font:800 13px/1.5 var(--f-ui);text-decoration:none;
  text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:none;cursor:pointer}
.bnav .bi{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#22a874,#0b5a3a);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .15s}
.bnav .bi svg{width:36px;height:36px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.bnav .on .bi{transform:translateY(-12px) scale(1.14);box-shadow:0 0 0 3px #c8ffe1,0 0 20px rgba(150,255,205,.85);background:radial-gradient(circle at 50% 35%,#4fe0a0,#0f7a4f)}
.bnav .on>span:last-child{margin-top:-10px;color:#fff6c8}
/* game switcher */
.gswitch{display:flex;justify-content:center;gap:2px;margin:4px auto 0;padding:5px;border-radius:999px;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.14);width:fit-content;position:relative}
.gswitch a{display:flex;flex-direction:column;align-items:center;padding:3px 22px;border-radius:999px;color:rgba(255,255,255,.6);font-weight:700;font-size:13px;text-decoration:none;line-height:1.5}
.gswitch a.on{color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.gswitch svg{width:28px;height:28px}
/* lobby cards */
.arcade{display:flex;flex-direction:column;gap:14px;position:relative;background:none!important;overflow:visible!important;margin-inline:0!important;padding:0!important}
.arcade::before{display:none}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;margin-top:6px}
.logo-svg{width:min(340px,92%);height:auto}
.logo-ku{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:-14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:relative}
.cards.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;border-radius:16px;padding:8px 6px 10px;color:#fff;text-decoration:none;
  font:inherit;font-weight:800;border:0;cursor:pointer;min-width:0;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 10px 18px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .1s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.16) 1.5px,transparent 2px) 0 0/14px 14px;pointer-events:none}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cs),0 4px 10px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.card .art{display:block;width:100%;aspect-ratio:4/3;position:relative}
.cards.small .card .art{aspect-ratio:1/1;width:78%}
.card .ct{position:relative;font-size:clamp(14px,4.4vw,19px);text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.cards.small .card .ct{font-size:clamp(12px,3.6vw,15px)}
.c-blue{background:linear-gradient(160deg,#5fe0ff,#139fd6);--cs:#0b6d96}
.c-purple{background:linear-gradient(160deg,#b9a2f2,#7c5bd6);--cs:#523a9e}
.c-yellow{background:linear-gradient(160deg,#ffd84d,#f2a90b);--cs:#b67600}
.c-green{background:linear-gradient(160deg,#a6e85a,#55b52a);--cs:#36801a}
.c-red{background:linear-gradient(160deg,#ff9a86,#e8584a);--cs:#a8352b}
@media (prefers-reduced-motion:reduce){.card,.bnav .bi{transition:none}}

.join-row input{background:rgba(255,255,255,.92);color:#123;border:0}
.stake span{background:rgba(0,0,0,.25)}
.table{box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 0 0 5px var(--rim,#0b5a3a),0 10px 22px rgba(0,0,0,.35)}
.seat.turn{border-color:#ffc928;box-shadow:0 0 0 3px rgba(255,201,40,.35),0 0 14px rgba(255,201,40,.45)}
.clock .track{background:rgba(0,0,0,.3)}

/* ===== levels 1-100 ===== */
.tb-av{background:conic-gradient(#ffd54f calc(var(--p,0) * 1%),rgba(255,255,255,.22) 0)}
.tb-av img{border:2px solid #0b6a44}
.lvl,.lv-chip,.lvc-badge,.lvup-b{--t1:#3fae4a;--t2:#1e6b28}
[data-tier="1"]{--t1:#3fa2ff;--t2:#1556b0}
[data-tier="2"]{--t1:#b07cff;--t2:#5b2bb0}
[data-tier="3"]{--t1:#ff6b5b;--t2:#a8261b}
[data-tier="4"]{--t1:#ffd54f;--t2:#b07800}
[data-tier="5"]{--t1:#7fe6ff;--t2:#7a3bff}
.tb-av .lvl{background:linear-gradient(var(--t1),var(--t2))}
.lv-chip{display:inline-block;font:800 10px/1 var(--f-mono);padding:3px 6px;border-radius:6px;background:linear-gradient(var(--t1),var(--t2));color:#fff;
  border:1px solid #ffd54f;margin-inline:4px;vertical-align:middle;direction:ltr;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.lvl-card{display:flex;flex-direction:column;gap:8px}
.lvc-top{display:flex;align-items:center;gap:12px}
.lvc-badge{flex:none;width:54px;height:60px;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--f-mono);text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:linear-gradient(var(--t1),var(--t2));clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);box-shadow:inset 0 0 0 3px #ffd54f}
.lvc-top .t{display:flex;flex-direction:column;min-width:0}
.lvc-top b{font-size:18px;color:#fff}
.lvc-bar{height:14px;border-radius:999px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 3px rgba(0,0,0,.4);overflow:hidden}
.lvc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(#ffe270,#f5a400);box-shadow:inset 0 1px 0 rgba(255,255,255,.6);transition:width .6s ease-out}
.lvup{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,20,10,.6);padding:16px}
.lvup-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 22px 20px;border-radius:22px;max-width:320px;width:100%;
  background:linear-gradient(180deg,#18a06a,#0b5c3c);border:2px solid rgba(255,255,255,.25);box-shadow:0 20px 40px rgba(0,0,0,.4);color:#fff;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.lvup-box .rays{position:absolute;left:50%;top:70px;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(rgba(255,230,140,0) 0 8deg,rgba(255,230,140,.55) 11deg,rgba(255,230,140,0) 14deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spinr 6s linear infinite}
.lvup-b{position:relative;width:96px;height:106px;display:grid;place-items:center;font:800 40px/1 var(--f-mono);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);
  background:linear-gradient(var(--t1),var(--t2));clip-path:polygon(50% 0,100% 18%,100% 70%,50% 100%,0 70%,0 18%);box-shadow:inset 0 0 0 4px #ffd54f}
.lvup-box b{position:relative;font-size:24px;color:#ffe270;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.lvup-box span{position:relative}
.lvup-box button{position:relative;margin-top:6px;min-width:140px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes spinr{to{transform:rotate(360deg)}}

.langs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lang-b{padding:9px 4px;font-size:13px;background:rgba(0,0,0,.22);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;font-weight:700}
.lang-b.on{background:linear-gradient(#ffe270,#ffb703);color:#5a3400;border-color:transparent;box-shadow:0 3px 0 #b97500}
.lvc-more{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.lvc-more b{color:#ffe270}
</style>

  ends(chain){if(!chain||!chain.length)return null;return[D.p(chain[0])[0],D.p(chain[chain.length-1])[1]]},
  // which sides a tile can go on: [] / ["l"] / ["r"] / ["l","r"]
  sides(t,chain){const e=D.ends(chain);if(!e)return["r"];const[a,b]=D.p(t),s=[];
    if(a===e[0]||b===e[0])s.push("l");if(a===e[1]||b===e[1])s.push("r");return s},
  place(chain,t,side){chain=(chain||[]).slice();const[a,b]=D.p(t);const e=D.ends(chain);
    if(!e){chain.push(a+"-"+b);return chain}
    if(side==="l"){const x=e[0];chain.unshift((a===x?b:a)+"-"+x)}
    else{const x=e[1];chain.push(x+"-"+(a===x?b:a))}
    return chain},
  canMove(hand,chain){return(hand||[]).some(t=>D.sides(t,chain).length)},
  // deal a round; starter = holder of the highest double (else highest tile), unless a seat is given
  deal(size,starter){const all=D.shuffle(D.all()),hands={};for(let s=0;s<size;s++)hands[s]=all.slice(s*7,s*7+7);
    const bone=all.slice(size*7);
    if(starter==null){let best=-1;starter=0;
      for(let s=0;s<size;s++)for(const t of hands[s]){const[a,b]=D.p(t);const v=(a===b?100:0)+a+b;if(v>best){best=v;starter=s}}}
    return{hands,bone,starter}},
  // result once a round stops: winner seat (or -1 for a tie) and points for the winning side
  settle(hands,size,emptied){
    let win=emptied;
    if(win==null){let lo=Infinity,who=[];for(let s=0;s<size;s++){const v=D.pips(hands[s]);if(v<lo){lo=v;who=[s]}else if(v===lo)who.push(s)}
      if(size===4&&who.length>1&&who.every(s=>s%2===who[0]%2))who=[who[0]];
      win=who.length===1?who[0]:-1}
    if(win<0)return{win:-1,pts:0};
    const wt=D.team(win,size);let pts=0;for(let s=0;s<size;s++)if(D.team(s,size)!==wt)pts+=D.pips(hands[s]);
    return{win,pts}}
};

async function joinRoom(c){
  const r=fdb.ref("dgames/"+c);let ok=false;
  const res=await r.transaction(cur=>{
    ok=false;if(!cur)return cur;
    if(cur.status!=="waiting")return;
    const seats=cur.seats||{};const n=cur.size||2;
    for(let i=0;i<n;i++)if(seats[i]&&seats[i].uid===me){ok=true;return cur}
    let free=-1;for(let i=0;i<n;i++)if(!seats[i]){free=i;break}
    if(free<0)return;
    seats[free]=who();cur.seats=seats;cur.updatedAt=Date.now();ok=true;
    let full=true;for(let i=0;i<n;i++)if(!seats[i])full=false;
    if(full)Object.assign(cur,startRound(cur,null,1));
    return cur;
  });
  return res.committed&&ok;
}

function openRoom(c,resume){

  try{localStorage.setItem("domino.current",c)}catch(e){}
  gRef.on("value",s=>{
    if(!s.exists()){if(!resume)toast("مێز نەما.");forget();show("lobby");return}
    G=s.val();G.size=G.size||2;
    const ms=mySeatIn(G);
    if(ms<0&&G.status!=="waiting"){forget();show("lobby");if(!resume)toast("مێز تژی بوو.");return}
    if(ms<0&&G.status==="waiting"){joinRoom(c);return}
    holdSeat();
    if(G.status==="waiting"&&!(G.seats&&G.seats[0])&&mySeatIn(G)>=0){repack();return}
    if(G.status==="playing"&&!(G.staked&&G.staked[mySeatIn(G)]))payStake();
    if(G.status==="over"){claimWinnings();const r=G.result||{},n=G.size||2,won=r.team!=null&&D.team(ms,n)===r.team;
      awardXp("d",c,r.team==null?XP_DRAW:won?XP_WIN:XP_LOSS)}

  });
}
function repack(){gRef.transaction(cur=>{if(!cur)return cur;if(cur.status!=="waiting")return;
  const left=Object.values(cur.seats||{}).filter(Boolean);if(!left.length)return null;
  const re={};left.forEach((p,i)=>re[i]=p);cur.seats=re;cur.host=re[0].uid;cur.updatedAt=Date.now();return cur}).catch(()=>{})}
function holdSeat(){
  const ms=mySeatIn(G);
  if(G.status==="waiting"&&ms>=0){const k=code+"/"+ms;if(seatHold===k)return;
    if(seatHold){fdb.ref("dgames/"+seatHold.replace("/","/seats/")).onDisconnect().cancel()}
    seatHold=k;fdb.ref("dgames/"+code+"/seats/"+ms).onDisconnect().remove().catch(()=>{})}
  else if(seatHold){fdb.ref("dgames/"+seatHold.replace("/","/seats/")).onDisconnect().cancel();seatHold=null}
}
function forget(){stopClock();stopVoice();if(seatHold){fdb.ref("dgames/"+seatHold.replace("/","/seats/")).onDisconnect().cancel();seatHold=null}if(gRef)gRef.off();gRef=null;G=null;code=null;stopAbandon();clearInterval(mergeTick);try{localStorage.removeItem("domino.current")}catch(e){}}
async function leaveRoom(silent){
  if(G&&G.status==="waiting"&&code){const c=code;
    await fdb.ref("dgames/"+c).transaction(cur=>{if(!cur)return cur;if(cur.status!=="waiting")return;
      const seats=cur.seats||{};let k=-1;for(const i in seats)if(seats[i]&&seats[i].uid===me)k=i;

  }

function tileSvg(t,vertical,size,isNew){

// lay the whole line out as a snake that fits the table: biggest tile size where every tile is visible
function renderChain(chain,last){
  const ch=$("chain");ch.textContent="";
  if(!chain.length){const s=document.createElement("span");s.className="empty";s.textContent="هێشتا چ پارچە نەهاتینە دانان";ch.append(s);return}
  const W=Math.max(240,(ch.clientWidth||340)-8),H=Math.max(260,Math.min(window.innerHeight*0.62,420)-20),GAP=3,RG=6;
  const isD=t=>{const[a,b]=D.p(t);return a===b};
  let L=34,rows;
  for(;L>=12;L--){rows=[[]];let w=0;
    for(const t of chain){const tw=(isD(t)?L:2*L)+GAP;if(w+tw>W&&rows[rows.length-1].length){rows.push([]);w=0}rows[rows.length-1].push(t);w+=tw}
    if(rows.length*(2*L+RG)<=H)break}
  let idx=0;
  rows.forEach((row,ri)=>{const div=document.createElement("div");div.className="crow"+(ri%2?" rev":"");
    row.forEach(t=>{const i=idx++;const isNew=last&&last.t&&((last.side==="l"&&i===0)||(last.side!=="l"&&i===chain.length-1));
      // on right-to-left rows the tile is read backwards so the matching numbers still touch
      const[a,b]=D.p(t);const shown=ri%2?(b+"-"+a):t;div.append(tileSvg(shown,a===b,L,isNew))});
    ch.append(div)});
}

// ---- turn clock: 15 seconds a turn; when it runs out the move is made for the player ----

async function autoMove(seat,started){

      if(!left.length){const hands={...g.hands,[seat]:[]};Object.assign(up,finishRound(hands,seat,false))}}
    else{const passes=(g.passes||0)+1;Object.assign(up,{["hands/"+seat]:hand.length?hand:null,passes,last:{seat,pass:true,auto:true}});
      if(passes>=n){const hands={};for(let i=0;i<n;i++)hands[i]=i===seat?hand:arr(g.hands[i]);Object.assign(up,finishRound(hands,null,true))}}
    await gRef.update(up);
    if(seat===mySeatIn(g))toast("دەم ب دوماهی هات · لڤین ب خۆ هاتە کرن");
  }catch(e){}
  autoBusy=false;
}

// ---- voice: hold the mic button, talk, let go; the clip plays for everyone at the table ----
let vRef=null,vSince=0,rec=null,recChunks=[],recStream=null,recStart=0,recTimer=null,muted=false,talking={};
function startVoice(){
  if(vRef||!code)return;vSince=srvNow()-2000;vRef=fdb.ref("dvoice/"+code);
  vRef.limitToLast(6).on("child_added",s=>{const v=s.val();if(!v||!v.data||(v.ts||0)<vSince||v.uid===me)return;
    talking[v.seat]=Date.now()+Math.min(16000,(v.dur||3)*1000);renderGame();setTimeout(()=>{if(G&&!$("game").hidden)renderGame()},(v.dur||3)*1000+300);
    if(muted)return;try{const a=new Audio(v.data);a.play().catch(()=>toast("🔊 پەیامەکا دەنگی هات · ل شاشێ بکە دا گوهـ لێ ببی"))}catch(e){}});
}
function stopVoice(){if(vRef)vRef.off();vRef=null;stopRec(false)}
async function startRec(e){
  e&&e.preventDefault();if(rec||!G||!code)return;
  try{recStream=recStream||await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(err){toast("ڕێ نەهاتە دان ب مایکێ. ل ڕێکخستنێن گەڕۆکێ ڕێ بدە.");return}
  const types=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"];const type=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  try{rec=new MediaRecorder(recStream,type?{mimeType:type,audioBitsPerSecond:24000}:undefined)}catch(err){toast("ئەڤ مۆبایلە تۆمارکرنا دەنگی پشتگیری ناکەت.");return}
  recChunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)recChunks.push(ev.data)};
  rec.onstop=sendClip;rec.start();recStart=Date.now();
  $("micBtn").classList.add("rec");
  recTimer=setInterval(()=>{const sec=Math.floor((Date.now()-recStart)/1000);$("micTxt").textContent="⏺ "+sec+" / 15";if(sec>=15)stopRec(true)},200);
}
function stopRec(send){
  clearInterval(recTimer);recTimer=null;$("micBtn").classList.remove("rec");$("micTxt").textContent="بگرە و باخڤە";
  if(rec){rec._send=send;try{rec.stop()}catch(e){}rec=null}
}
async function sendClip(ev){
  const r=ev.target,dur=(Date.now()-recStart)/1000;if(!r._send||dur<0.6||!recChunks.length)return;
  const blob=new Blob(recChunks,{type:r.mimeType||"audio/webm"});
  if(blob.size>150000){toast("پەیام درێژە. کورتتر باخڤە.");return}
  const data=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(blob)});
  try{const ref=vRef||fdb.ref("dvoice/"+code);
    await ref.push({uid:me,seat:mySeatIn(G),data,dur:Math.round(dur*10)/10,ts:now()});
    // keep the store small: drop my clips older than a minute
    const old=await ref.orderByChild("ts").endAt(srvNow()-60000).once("value");
    old.forEach(c=>{if(c.val()&&c.val().uid===me)c.ref.remove()});
  }catch(e){toast("پەیام نەهاتە هنارتن.")}
}

// round end: work out the winner, add points, and close the game when it is decided
function finishRound(hands,emptied,blocked){
  const g=G,n=g.size,res=D.settle(hands,n,emptied);
  const result={win:res.win,pts:res.pts,blocked,hands,team:res.win>=0?D.team(res.win,n):null,...winMap(res.win>=0?D.team(res.win,n):null,n)};
  if(g.mode!=="points"){awardScores(result.team);return{status:"over",result}}
  const pts={0:(g.pts&&g.pts[0])||0,1:(g.pts&&g.pts[1])||0};
  if(res.win>=0)pts[result.team]=(pts[result.team]||0)+res.pts;
  if(result.team!=null&&pts[result.team]>=GOAL){awardScores(result.team);return{status:"over",result,pts}}
  return{status:"roundover",result,pts};
}
async function nextRound(){
  const g=G;if(g.status!=="roundover")return;
  const r=g.result||{};const starter=r.win>=0?r.win:null;
  try{await gRef.transaction(cur=>{if(!cur)return cur;if(cur.status!=="roundover")return;return{...cur,...startRound(cur,starter,(cur.round||1)+1),pts:cur.pts}})}catch(e){}
}
// same leaderboard as chess: win 3, draw 1
let stakeBusy=false;
async function payStake(){
  if(stakeBusy)return;stakeBusy=true;const ms=mySeatIn(G),c=code;
  try{await fdb.ref().update({["coins/"+me+"/c"]:firebase.database.ServerValue.increment(-STAKE),["dgames/"+c+"/staked/"+ms]:true})}catch(e){}
  stakeBusy=false;
}
function winMap(team,n){if(team==null)return{draw:true};const w={};for(let i=0;i<n;i++)if(D.team(i,n)===team)w[i]=true;return{winSeats:w}}
// each winner claims their own share; the server rules check the game result before allowing it
let claimBusy=false;
async function claimWinnings(){
  const g=G,ms=mySeatIn(g),r=g.result||{};if(claimBusy||ms<0||!(g.staked&&g.staked[ms])||(g.paid&&g.paid[ms]))return;
  const amt=r.draw?STAKE:(r.winSeats&&r.winSeats[ms]?STAKE*2:0);if(!amt)return;
  claimBusy=true;
  try{await fdb.ref().update({["coins/"+me+"/c"]:firebase.database.ServerValue.increment(amt),["coins/"+me+"/claim"]:code,["coins/"+me+"/claimSeat"]:String(ms),["dgames/"+code+"/paid/"+ms]:true})}catch(e){}
  claimBusy=false;
}
// the pot goes to the winning side (50 each); a draw gives everyone their stake back
function coinsFor(team,g){const n=g.size,out={};
  seatsOf(g).forEach((p,i)=>{if(!p||!(g.staked&&g.staked[i]))return;const t=D.team(i,n);
    out[i]=team==null?STAKE:(t===team?STAKE*2:0)});return out}
function awardScores(team){
  const g=G,n=g.size,inc=firebase.database.ServerValue.increment,up={};
  seatsOf(g).forEach((p,i)=>{if(!p)return;const t=D.team(i,n);const k="scores/"+p.uid+"/";
    up[k+"name"]=p.name||"";if(p.photo)up[k+"photo"]=p.photo;
    if(team==null){up[k+"points"]=inc(1);up[k+"draws"]=inc(1)}
    else if(t===team){up[k+"points"]=inc(3);up[k+"wins"]=inc(1)}
    else up[k+"losses"]=inc(1)});

  fdb.ref().update(up).catch(()=>{});
}
// presence at the table; if someone is gone for a minute, the other side wins
function watchConn(){
  const g=G,ms=mySeatIn(g),n=g.size;if(g.status!=="playing"||ms<0){stopAbandon();return}
  if(!g.conn||!g.conn[ms]){const c=fdb.ref("dgames/"+code+"/conn/"+ms);c.onDisconnect().remove();c.set(true).catch(()=>{})}
  const gone=[];for(let i=0;i<n;i++)if(i!==ms&&!(g.conn&&g.conn[i]))gone.push(i);
  if(!gone.length){stopAbandon();return}
  if(abandonSince)return;abandonSince=Date.now();
  abandonTick=setInterval(()=>{
    if(!G||G.status!=="playing"){stopAbandon();return}
    const left=GRACE-Math.floor((Date.now()-abandonSince)/1000);
    if(GRACE-left>=6){const pill=$("turnPill");pill.className="pill bad";pill.textContent="یاریکەرەک دەرکەفت… "+Math.max(left,0)+" چرکە"}
    if(left<=0){stopAbandon();const g2=G;const goneNow=[];for(let i=0;i<n;i++)if(!(g2.conn&&g2.conn[i]))goneNow.push(i);
      if(!goneNow.length)return;const loser=D.team(goneNow[0],n);const team=n===4?1-loser:(goneNow[0]===0?1:0);
      awardScores(team);gRef.update({status:"over",result:{reason:"quit",team,win:-1,...winMap(team,n)},updatedAt:now()}).catch(()=>{})}
  },1000);
}
function stopAbandon(){clearInterval(abandonTick);abandonTick=null;abandonSince=null}
async function quitGame(){
  const g=G,ms=mySeatIn(g),n=g.size;
  if(g.status==="playing"){const loser=D.team(ms,n);const team=n===4?1-loser:(ms===0?1:0);awardScores(team);
    try{await gRef.update({status:"over",result:{reason:"quit",team,win:-1,...winMap(team,n)},updatedAt:now()})}catch(e){}}
  const c=fdb.ref("dgames/"+code+"/conn/"+ms);c.onDisconnect().cancel();c.remove().catch(()=>{});
  forget();show("lobby");
}

// ---------- wiring ----------
segs();
window.addEventListener("resize",()=>{if(G&&G.status&&G.status!=="waiting"&&!$("game").hidden)renderChain(arr(G.chain),G.last)});
$("card2").onclick=()=>openModeSheet(2);$("card4").onclick=()=>openModeSheet(4);$("cardPriv").onclick=()=>openModeSheet("priv");
$("msClose").onclick=closeModeSheet;$("modeSheet").onclick=e=>{if(e.target.id==="modeSheet")closeModeSheet()};
$("findBtn").onclick=()=>{closeModeSheet();if(sheetFor==="priv")privateRoom();else findMatch()};
$("joinBtn").onclick=joinByCode;
$("codeInput").addEventListener("keydown",e=>{if(e.key==="Enter")joinByCode()});
$("leaveWait").onclick=()=>leaveRoom();
$("copyCode").onclick=async()=>{try{await navigator.clipboard.writeText($("waitCode").textContent);toast("کۆد هاتە کۆپیکرن")}catch(e){}};
$("drawBtn").onclick=drawTile;
const mic=$("micBtn");
mic.addEventListener("pointerdown",startRec);
["pointerup","pointerleave","pointercancel"].forEach(ev=>mic.addEventListener(ev,()=>stopRec(true)));
mic.addEventListener("contextmenu",e=>e.preventDefault());
$("muteBtn").onclick=()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";$("muteBtn").setAttribute("aria-pressed",muted)};$("passBtn").onclick=pass;
$("quitBtn").onclick=()=>{$("quitQ").textContent=G&&G.status==="playing"?"ئەگەر دەرکەڤی، تو دۆڕی. پشتڕاستی؟":"دەرکەڤی؟";$("quitConfirm").hidden=false};
$("quitNo").onclick=()=>$("quitConfirm").hidden=true;
$("quitYes").onclick=()=>{$("quitConfirm").hidden=true;quitGame()};
if(typeof firebase!=="undefined")boot();else show("login");
</script>
