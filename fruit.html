<!doctype html>
<html lang="ku" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>میوێن کوردستانێ · AG Classic Games</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f3d2e">
<style>
/* Kurdistan fruits: a match-3 game. Swap two fruits side by side to line up 3 or more of the same kind.
   Levels on a map, goals and a number of moves, 3 stars, hearts, special fruits, and friends' progress. */
:root{--gold:#ffcf4a;--gold2:#c98a0c;--deep:#0f3d2e;--leaf:#1f7a4d;--cream:#fff7e6;--ink:#2a1a08;--line:rgba(255,215,120,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0f3d2e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
[hidden]{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column}
/* top bar: hearts, my picture, coins */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  background:linear-gradient(#2b8a5a,#176043);border-bottom:3px solid var(--gold2);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:22px;padding:4px 12px 4px 6px;font-weight:900;font-size:15px;min-width:0}
.pill i{font-style:normal;font-size:20px}.pill small{font-weight:700;font-size:12px;opacity:.85}
.mybox{position:relative;width:46px;height:46px;border-radius:50%;margin-inline:auto;flex:none}
.mybox>img{display:block;width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#245}
.gear{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a21a 60%,#9a6400);border:2px solid #fff6;font-size:20px;flex:none;box-shadow:0 3px 0 #6b4500}
/* the map */
#map{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#mapIn{position:relative;width:100%;background:
  radial-gradient(ellipse 60% 4% at 50% 2%,rgba(255,255,255,.25),transparent),
  linear-gradient(#7fd3ff 0,#bdeaff 4%,#8fd36a 7%,#4fae55 30%,#3f9a4c 60%,#2f8445 100%)}
#mapIn svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:34px;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffe9a0,#f0b429 55%,#a86d00);border:3px solid #fff8;box-shadow:0 5px 0 #6b4500,0 8px 14px rgba(0,0,0,.35);text-shadow:0 2px 0 #8a5a00}
.node.lock{background:radial-gradient(circle at 35% 30%,#d9e2dc,#8fa39a 60%,#5d6e66);box-shadow:0 5px 0 #3c4a43;color:#eef;text-shadow:none;font-size:18px}
.node.cur{animation:pulse 1.4s infinite;background:radial-gradient(circle at 35% 30%,#ffb3c1,#e63957 55%,#8a0f2b);box-shadow:0 5px 0 #5c0718,0 0 0 6px rgba(255,255,255,.35)}
@keyframes pulse{50%{transform:scale(1.1)}}
.node .st{position:absolute;bottom:-17px;font-size:13px;letter-spacing:-2px;text-shadow:none}
.fav{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #fff;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.4);background:#245;z-index:2}
.fav.mine{width:44px;height:44px;margin:-22px 0 0 -22px;border-color:var(--gold);z-index:3}
/* bottom tabs */
.tabs{display:flex;background:linear-gradient(#1c6b47,#0f4630);border-top:3px solid var(--gold2);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;font-weight:800;background:none;opacity:.75}
.tabs button i{font-style:normal;font-size:26px}.tabs button.on{opacity:1;background:rgba(255,255,255,.12)}
/* ranking */
#duel{flex:1;overflow-y:auto;padding:16px;background:linear-gradient(#1f6e4a,#0f3d2e);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
#duel .card{width:100%;max-width:420px;background:var(--cream);color:var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 4px 0 #c9a46a}
#duel input{width:100%;padding:12px;border-radius:14px;border:2px solid #d8b16a;font-size:22px;text-align:center;letter-spacing:5px;font-weight:900;font-family:ui-monospace,monospace;text-transform:uppercase}
.dcode{font-size:40px;font-weight:900;letter-spacing:6px;font-family:ui-monospace,monospace;color:#b8321f}
.vs{display:flex;align-items:center;justify-content:center;gap:16px}.vs .p{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;max-width:120px}.vs .p img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#245}.vs .p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}.vs b{font-size:30px;color:#b8321f}
.duelhud{display:flex;justify-content:space-around;align-items:center;gap:8px;font-weight:900;font-size:14px}.duelhud div{display:flex;align-items:center;gap:6px;background:#fffaf0;border:2px solid #d8b16a;border-radius:14px;padding:3px 10px}.duelhud img{width:26px;height:26px;border-radius:50%;object-fit:cover}.duelhud .lead{border-color:#4caf50;background:#d7f7d0}
#shop{flex:1;overflow-y:auto;padding:14px;background:linear-gradient(#1f6e4a,#0f3d2e)}
.sh-h{margin:14px 4px 8px;font-size:17px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px}
.sh-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{position:relative;background:linear-gradient(#fffaf0,#f3e1b8);color:var(--ink);border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 4px 0 #c9a46a,0 6px 14px rgba(0,0,0,.25);border:2px solid #fff6}
.it.wide{grid-column:1/-1;flex-direction:row;text-align:start;gap:12px;background:linear-gradient(135deg,#fff3c4,#ffd36b 60%,#f2a81d);border-color:#fff}
.it .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,#fff,#bfe9ff 45%,#4a9fd4);border:3px solid #fff;box-shadow:0 3px 0 #2d6f99,inset 0 -6px 10px rgba(0,0,0,.15);flex:none}
.it .ic.gold{background:radial-gradient(circle at 35% 30%,#fff,#ffe07a 45%,#d48a00);box-shadow:0 3px 0 #8a5a00,inset 0 -6px 10px rgba(0,0,0,.15)}
.it .ic.pink{background:radial-gradient(circle at 35% 30%,#fff,#ffb3c8 45%,#e0457b);box-shadow:0 3px 0 #8a1a45,inset 0 -6px 10px rgba(0,0,0,.15)}
.it b{font-size:14px}.it small{font-size:12px;opacity:.8;line-height:1.5}.it .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.it .have{position:absolute;top:6px;inset-inline-start:8px;background:#2e7d32;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:900}
.it .rib{position:absolute;top:-8px;inset-inline-end:10px;background:#e63957;color:#fff;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:900;box-shadow:0 2px 0 #8a0f2b}
.buy{background:linear-gradient(#5fd17a,#21964a);color:#fff;font-weight:900;font-size:15px;padding:8px 16px;border-radius:20px;box-shadow:0 3px 0 #116b31;white-space:nowrap}
.buy.ag{background:linear-gradient(#ffd75e,#e09a12);color:#3a2300;box-shadow:0 3px 0 #8a5a00}.buy.used{background:#cfc6ae;color:#5a4a2a;box-shadow:none}
.lk{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;width:100%;min-height:52px;align-items:center;border-radius:12px;padding:4px;background:linear-gradient(#2c8a5c,#145a3c);background-size:cover;background-position:center}
.lk svg{width:30px;height:30px}
.pre{display:flex;gap:10px;justify-content:center}.pre button{position:relative;width:62px;height:62px;border-radius:50%;font-size:28px;background:radial-gradient(circle at 35% 30%,#fff,#bfe9ff 50%,#5aa9d8);border:3px solid #fff;box-shadow:0 3px 0 #2d6f99}
.pre button.on{outline:4px solid #4caf50;background:radial-gradient(circle at 35% 30%,#fff,#c8f7c5 50%,#4caf50)}.pre button small{position:absolute;bottom:-6px;inset-inline-end:-6px;background:#e63957;color:#fff;border-radius:10px;padding:0 6px;font-size:11px;font-weight:900}
.pre button:disabled{filter:grayscale(1) opacity(.5)}
#rank{flex:1;overflow-y:auto;padding:14px;background:linear-gradient(#1f6e4a,#0f3d2e)}
.rk{display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:9px;box-shadow:0 3px 0 #c9a46a}
.rk.mine{outline:3px solid var(--gold)}
.rk>span{width:30px;text-align:center;font-weight:900;font-size:18px}
.rk img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#245;flex:none}
.rk b{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk em{font-style:normal;font-weight:900;color:#a15c00;text-align:center;line-height:1.2}.rk em small{display:block;font-size:11px;color:#7a6a50}
.hint2{text-align:center;opacity:.85;font-size:14px;line-height:1.7;padding:10px}
.btn{background:linear-gradient(#ffd75e,#e09a12);color:#3a2300;font-weight:900;font-size:18px;padding:13px 28px;border-radius:30px;box-shadow:0 5px 0 #8a5a00,0 8px 14px rgba(0,0,0,.3)}
.btn.blue{background:linear-gradient(#5ecbff,#1b7fd6);color:#fff;box-shadow:0 5px 0 #0d4f8a}
.btn.red{background:linear-gradient(#ff7a8a,#d6233f);color:#fff;box-shadow:0 5px 0 #7d0a1d}
.btn:active{transform:translateY(3px)}
/* the level screen */
#play{background:radial-gradient(ellipse at 50% 30%,#3aa36b,#145a3c 70%)}
.hud{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#f6e3b4,#e8c77d);color:var(--ink);border-bottom:3px solid #b98a3a;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.mv{display:flex;flex-direction:column;align-items:center;min-width:64px}.mv b{font-size:34px;line-height:1;color:#b8321f;text-shadow:0 2px 0 #fff}.mv small{font-size:11px;font-weight:800}
.prog{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.sbar{position:relative;height:12px;border-radius:8px;background:#7a4a1a;overflow:visible}.sbar>i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:linear-gradient(90deg,#ffd75e,#ff8a1e);transition:width .4s}
html[dir=rtl] .sbar>i{inset:0 0 0 auto;background:linear-gradient(-90deg,#ffd75e,#ff8a1e)}
.sbar>em{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:16px;filter:grayscale(1) opacity(.6)}.sbar>em.on{filter:none}
html[dir=rtl] .sbar>em{transform:translate(50%,-50%)}
.goals{display:flex;gap:8px;justify-content:center}
.goal{position:relative;display:flex;align-items:center;gap:4px;background:#fffaf0;border:2px solid #d8b16a;border-radius:12px;padding:2px 8px 2px 4px;font-weight:900;font-size:15px}
.goal svg{width:30px;height:30px}.goal.done{background:#d7f7d0;border-color:#4caf50}.goal.done::after{content:"✔";color:#2e7d32}
.sc{font-weight:900;font-size:13px;text-align:center}
#boardWrap{flex:1;display:grid;place-items:center;padding:10px;position:relative}
#board{position:relative;touch-action:none;border-radius:16px;background:rgba(10,40,25,.55);border:3px solid var(--line);box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4)}
.cell{position:absolute;border-radius:10px;background:rgba(255,255,255,.07)}
.cell.alt{background:rgba(255,255,255,.12)}
.cell.ice{background:linear-gradient(135deg,rgba(200,240,255,.85),rgba(120,200,240,.7));box-shadow:inset 0 0 0 2px rgba(255,255,255,.8)}
.cell.ice2{background:linear-gradient(135deg,rgba(150,215,255,.95),rgba(60,150,220,.85));box-shadow:inset 0 0 0 3px #fff}
.fr{position:absolute;left:0;top:0;transition:transform .2s ease-in;will-change:transform;pointer-events:none}
.fr svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.fr.sel svg{animation:wob .5s infinite alternate}
.fr.hint svg{animation:hint .6s 3 alternate}
.fr.pop{transition:transform .22s ease-out,opacity .22s;opacity:0}
@keyframes wob{to{transform:scale(1.12) rotate(6deg)}}
@keyframes hint{to{transform:scale(1.18)}}
.burst{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,230,120,.8) 40%,transparent 70%);animation:burst .35s ease-out forwards}
@keyframes burst{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.crack{position:absolute;pointer-events:none;border-radius:10px;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(170,225,255,.6) 45%,transparent 70%);animation:burst .4s ease-out forwards}
.beam{position:absolute;pointer-events:none;background:linear-gradient(90deg,transparent,#fff,transparent);animation:beam .35s ease-out forwards;border-radius:6px}
@keyframes beam{from{opacity:1}to{opacity:0}}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #b06500,0 0 6px #000;animation:fl .8s ease-out forwards;z-index:9}
@keyframes fl{to{transform:translateY(-40px);opacity:0}}
.praise{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:900;font-size:40px;color:#fff;text-shadow:0 4px 0 #c96a00,0 0 18px #ffb300;pointer-events:none;animation:praise 1.1s ease-out forwards;z-index:10;white-space:nowrap}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#f6e3b4,#e8c77d);border-top:3px solid #b98a3a}
.pbar .gear{margin-inline-end:auto}
.boost{position:relative;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfe9ff 50%,#5aa9d8);border:2px solid #fff;font-size:26px;box-shadow:0 3px 0 #2d6f99}
.boost small{position:absolute;bottom:-4px;inset-inline-end:-6px;background:#e63957;color:#fff;border-radius:10px;padding:0 5px;font-size:11px;font-weight:900}
.boost.on{outline:4px solid var(--gold);animation:pulse 1s infinite}
/* windows */
.ov{position:fixed;inset:0;z-index:30;background:rgba(5,20,12,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.win{position:relative;width:min(380px,100%);background:linear-gradient(#fff7e6,#f6e3b4);color:var(--ink);border-radius:26px;border:4px solid #e0a21a;box-shadow:0 0 0 4px #fff6,0 16px 40px rgba(0,0,0,.5);padding:22px 18px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:drop .35s cubic-bezier(.2,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-60px) scale(.9);opacity:0}}
.win h2{margin:0;font-size:28px;color:#b8321f;text-shadow:0 2px 0 #fff}
.win .x{position:absolute;top:-16px;inset-inline-end:-12px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d6233f);color:#fff;font-size:22px;font-weight:900;border:3px solid #fff;box-shadow:0 3px 0 #7d0a1d}
.stars3{display:flex;gap:6px;justify-content:center;font-size:46px}.stars3 span{filter:grayscale(1) opacity(.35)}.stars3 span.on{filter:none;animation:pop .4s backwards}
.stars3 span:nth-child(2).on{animation-delay:.25s}.stars3 span:nth-child(3).on{animation-delay:.5s}
@keyframes pop{from{transform:scale(0)}}
.wg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tg{display:flex;gap:14px;justify-content:center}
.tg button{width:58px;height:58px;border-radius:50%;font-size:26px;background:radial-gradient(circle at 35% 30%,#bfe9ff,#3a9be0 60%,#1b5f99);border:3px solid #fff;box-shadow:0 4px 0 #0d3f66}
.tg button.off{filter:grayscale(1) opacity(.5)}
.help{text-align:start;font-size:14px;line-height:1.8;margin:0;padding-inline-start:18px}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.langs button{padding:6px 12px;border-radius:14px;background:#e9d6a8;font-weight:800;font-size:13px}.langs button.on{background:#e0a21a;color:#fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1a2b22;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.gswitch{display:none}
</style>
</head>
<body>
<script src="games.js"></script>
<script src="fruitskins.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- the map and the ranking -->
<div class="scr" id="home">
  <div class="bar">
    <div class="pill" id="hearts"><i>❤️</i><span id="hN">5</span><small id="hT"></small></div>
    <div class="mybox" id="meAv"><img id="meImg" alt=""></div>
    <div class="pill" id="coinsP"><i>🪙</i><span id="cN">0</span></div>
    <button class="gear" id="hGear" type="button" aria-label="⚙">⚙</button>
  </div>
  <div id="map"><div id="mapIn"></div></div>
  <div id="rank" hidden></div>
  <div id="duel" hidden></div>
  <div id="shop" hidden></div>
  <div class="tabs">
    <a href="./" class="" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;font-weight:800;color:#fff;text-decoration:none;opacity:.75"><i style="font-style:normal;font-size:26px">🏠</i><span data-t="home"></span></a>
    <button type="button" id="tMap" class="on"><i>🗺️</i><span data-t="map"></span></button>
    <button type="button" id="tDuel"><i>⚔️</i><span data-t="duel"></span></button>
    <button type="button" id="tRank"><i>🏆</i><span data-t="friends"></span></button>
    <button type="button" id="tShop"><i>🛒</i><span data-t="shop"></span></button>
  </div>
  <nav class="gswitch" aria-label="یاری"></nav>
</div>

<!-- a level -->
<div class="scr" id="play" hidden>
  <div class="hud">
    <div class="mv"><b id="mv">20</b><small data-t="moves"></small></div>
    <div class="prog">
      <div class="goals" id="goals"></div>
      <div class="sbar" id="sbar"><i id="sfill"></i><em style="left:33%">⭐</em><em style="left:62%">⭐</em><em style="left:94%">⭐</em></div>
      <div class="sc"><span data-t="score"></span>: <span id="sc">0</span> · <span data-t="level"></span> <span id="lvN">1</span></div>
    </div>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="pbar">
    <button class="gear" id="pGear" type="button" aria-label="⚙">⚙</button>
    <button class="boost" id="bHam" type="button" title="🔨">🔨<small>1</small></button>
    <button class="boost" id="bShuf" type="button" title="🔀">🔀<small>1</small></button>
    <button class="boost" id="bHand" type="button" title="🖐">🖐<small>0</small></button>
  </div>
</div>
<div id="ovl" class="ov" hidden></div>

<script>
"use strict";
// ---------- languages ----------
const LANGS=["kmr","ckb","ar","en"],LBL={kmr:"بادینی",ckb:"سۆرانی",ar:"عربي",en:"EN"};
let L=(()=>{try{const v=localStorage.getItem("lang");return LANGS.includes(v)?v:"kmr"}catch(e){return"kmr"}})();
const LI=()=>LANGS.indexOf(L);

    const rv=AC.createConvolver();rv.buffer=ir;const rg=AC.createGain();rg.gain.value=.22;rv.connect(rg);rg.connect(mg);SND.rev=rv;
    const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;SND.noise=nb}

function vo(f,f2,d,type,v,delay,wet){const a=snd();if(!a)return;const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(SND.out);if(wet!==0)g.connect(SND.rev);o.start(t0);o.stop(t0+d+.05)}

function nz(fType,f,f2,q,d,v,delay){const a=snd();if(!a)return;const t0=a.currentTime+(delay||0),s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=SND.noise;fl.type=fType;fl.Q.value=q;

  s.connect(fl);fl.connect(g);g.connect(SND.out);g.connect(SND.rev);s.start(t0,Math.random()*.5);s.stop(t0+d+.05)}

const NL=200,N=8;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function level(n){const r=rng(n*7919+13),types=n<=3?4:n<=25?5:6,moves=Math.max(15,21-Math.floor(n/25)+Math.floor(r()*4)),g=[],ice=[];
  const kind=n<=2?"c":["c","s","c2","i","c"][(n-1)%5];
  const amt=b=>Math.min(70,Math.round(b+n*1.1+r()*5));
  if(kind==="c"){g.push({t:"c",f:Math.floor(r()*types),n:amt(14)})}
  else if(kind==="c2"){const a=Math.floor(r()*types);let b=(a+1+Math.floor(r()*(types-1)))%types;g.push({t:"c",f:a,n:amt(8)},{t:"c",f:b,n:amt(8)})}
  else if(kind==="s"){g.push({t:"s",n:2600+n*160})}
  else{const lay=Math.floor(r()*4);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on=false;
      if(lay===0)on=y>=5;else if(lay===1)on=(x===y||x===N-1-y);else if(lay===2)on=(x>=2&&x<=5&&y>=2&&y<=5);else on=(y>=3&&y<=4)||(x>=3&&x<=4);
      if(on)ice.push([x,y,n>40&&r()<.35?2:1])}
    g.push({t:"i",n:ice.length})}
  const base=g[0].t==="s"?g[0].n:3500+n*250;
  return{n,types,moves:moves+(kind==="i"?5:0),goals:g,ice,s1:Math.round(base),s2:Math.round(base*1.7),s3:Math.round(base*2.6)}}

// ================= the board =================
let G=null;     // the level being played
let CS=40,busy=false,sel=null,idSeq=1,hintT=null,boostMode=null;
const inB=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function newFruit(types,r){return{t:Math.floor((r||(G&&G.rnd)||Math.random)()*types),sp:null,id:idSeq++,el:null}}
// a starting board with no lines already made
function fillStart(){const g=[];for(let y=0;y<N;y++){g.push([]);for(let x=0;x<N;x++){let f;do{f=newFruit(G.lv.types)}while((x>=2&&g[y][x-1].t===f.t&&g[y][x-2].t===f.t)||(y>=2&&g[y-1][x].t===f.t&&g[y-2][x].t===f.t));g[y].push(f)}}return g}
function layout(){const wrap=$("boardWrap"),s=Math.floor(Math.min(wrap.clientWidth-20,wrap.clientHeight-20)/N);CS=Math.max(30,Math.min(70,s));
  const b=$("board");b.style.width=b.style.height=(CS*N+8)+"px";[...b.querySelectorAll(".cell")].forEach(c=>{c.style.left=(4+c._x*CS+2)+"px";c.style.top=(4+c._y*CS+2)+"px";c.style.width=c.style.height=(CS-4)+"px"});
  G&&G.g.forEach((row,y)=>row.forEach((f,x)=>{if(f&&f.el){f.el.style.width=f.el.style.height=CS+"px";place(f,x,y,true)}}))}
function place(f,x,y,now){const e=f.el;if(now){e.style.transition="none";e.style.transform="translate("+(4+x*CS)+"px,"+(4+y*CS)+"px)";void e.offsetWidth;e.style.transition=""}else e.style.transform="translate("+(4+x*CS)+"px,"+(4+y*CS)+"px)"}
function mkEl(f,x,y,fromY){const e=document.createElement("div");e.className="fr";e.style.width=e.style.height=CS+"px";e.innerHTML=fsvg(f.t,f.sp);f.el=e;$("board").append(e);
  if(fromY!=null){place(f,x,fromY,true);requestAnimationFrame(()=>requestAnimationFrame(()=>place(f,x,y)))}else place(f,x,y,true)}
const redraw=f=>{f.el.innerHTML=fsvg(f.t,f.sp)};
let cellEl=[];
const iceCls=(x,y)=>{const ic=G.ice[y][x];return"cell"+((x+y)%2?" alt":"")+(ic===1?" ice":ic>=2?" ice2":"")};
function drawCells(){const b=$("board");[...b.querySelectorAll(".cell")].forEach(c=>c.remove());cellEl=[...Array(N)].map(()=>Array(N));for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=document.createElement("div");c._x=x;c._y=y;
  c.className=iceCls(x,y);cellEl[y][x]=c;b.prepend(c)}layout()}
// the ice under a fruit cracks: one layer less, with a little crack and sound
function crackIce(x,y){const c=cellEl[y]&&cellEl[y][x];if(c)c.className=iceCls(x,y);fx("crack",4+x*CS,4+y*CS,CS,CS);sfx.ice()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function startLevel(n,pre){const lv=level(n);G={lv,n,moves:lv.moves,score:0,got:{},iceLeft:0,boost:{ham:1,shuf:1,hand:0},over:false,combo:0};paintPlayBg();
  G.ice=[...Array(N)].map(()=>Array(N).fill(0));lv.ice.forEach(([x,y,k])=>{G.ice[y][x]=k});G.iceLeft=lv.ice.reduce((a,v)=>a+v[2],0);
  $("home").hidden=true;$("play").hidden=false;$("board").textContent="";$("lvN").textContent=num(n);
  G.g=fillStart();while(!anyMove())G.g=fillStart();
  // boosters chosen before the level: a rainbow star, or a striped and a shiny fruit, already on the board
  if(pre&&pre.star){const x=Math.floor(Math.random()*N),y=2+Math.floor(Math.random()*4);G.g[y][x].t=-1;G.g[y][x].sp="b"}
  if(pre&&pre.sw){const a=G.g[1+Math.floor(Math.random()*3)][Math.floor(Math.random()*N)],b=G.g[4+Math.floor(Math.random()*3)][Math.floor(Math.random()*N)];if(a.t>=0)a.sp="h";if(b.t>=0)b.sp="w"}
  requestAnimationFrame(()=>{drawCells();G.g.forEach((row,y)=>row.forEach((f,x)=>mkEl(f,x,y,y-N-1)));hud();idleHint()})}
function paintPlayBg(){const u=window.M3SK?M3SK.bgUrl(SKIN.bg):"";$("play").style.backgroundImage=u?u:"";$("play").style.backgroundSize=u?"cover":"";$("play").style.backgroundPosition="center"}
function hud(){$("mv").textContent=num(G.moves);$("bHam").hidden=$("bShuf").hidden=$("bHand").hidden=!!G.duel;if(G.duel){$("sc").textContent=num(G.score);duelHud();return}$("sc").textContent=num(G.score);const lv=G.lv,p=Math.min(1,G.score/lv.s3);$("sfill").style.width=(p*100)+"%";
  const ems=$("sbar").querySelectorAll("em");[lv.s1,lv.s2,lv.s3].forEach((s,i)=>{ems[i].style.left=ems[i].style.right="";ems[i].style[L==="en"?"left":"right"]=(s/lv.s3*94)+"%";ems[i].classList.toggle("on",G.score>=s)});
  const gb=$("goals");gb.textContent="";lv.goals.forEach(g=>{const d=document.createElement("div"),left=goalLeft(g);d.className="goal"+(left<=0?" done":"");d.innerHTML=goalIcon(g)+'<span></span>';d.querySelector("span").textContent=left>0?num(left):"";gb.append(d)});
  $("bHam").querySelector("small").textContent=num(G.boost.ham+inv.ham);$("bShuf").querySelector("small").textContent=num(G.boost.shuf+inv.shuf);$("bHand").querySelector("small").textContent=num(inv.hand)}
function goalLeft(g){if(g.t==="c")return Math.max(0,g.n-(G.got[g.f]||0));if(g.t==="i")return G.iceLeft;return Math.max(0,g.n-G.score)}
const goalsDone=()=>G.lv.goals.length>0&&G.lv.goals.every(g=>goalLeft(g)<=0);

// ---------- finding lines ----------
function findRuns(){const runs=[];for(let y=0;y<N;y++){let x=0;while(x<N){const f=G.g[y][x];if(!f||f.t<0){x++;continue}let e=x+1;while(e<N&&G.g[y][e]&&G.g[y][e].t===f.t)e++;if(e-x>=3){const c=[];for(let i=x;i<e;i++)c.push([i,y]);runs.push({d:"h",c,t:f.t})}x=e}}
  for(let x=0;x<N;x++){let y=0;while(y<N){const f=G.g[y][x];if(!f||f.t<0){y++;continue}let e=y+1;while(e<N&&G.g[e][x]&&G.g[e][x].t===f.t)e++;if(e-y>=3){const c=[];for(let i=y;i<e;i++)c.push([x,i]);runs.push({d:"v",c,t:f.t})}y=e}}return runs}
function hasLineAt(){return findRuns().length>0}
function swapCells(a,b){const t2=G.g[a[1]][a[0]];G.g[a[1]][a[0]]=G.g[b[1]][b[0]];G.g[b[1]][b[0]]=t2}
function anyMove(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=G.g[y][x];if(!f)continue;if(f.t<0)return true;
  for(const[dx,dy]of[[1,0],[0,1]]){const nx=x+dx,ny=y+dy;if(!inB(nx,ny)||!G.g[ny][nx])continue;const o=G.g[ny][nx];if(o.t<0||(f.sp&&o.sp))return[[x,y],[nx,ny]];swapCells([x,y],[nx,ny]);const ok=hasLineAt();swapCells([x,y],[nx,ny]);if(ok)return[[x,y],[nx,ny]]}}return false}

// ---------- clearing ----------
function fx(cls,x,y,w,h){const e=document.createElement("div");e.className=cls;e.style.left=x+"px";e.style.top=y+"px";e.style.width=w+"px";e.style.height=h+"px";$("board").append(e);setTimeout(()=>e.remove(),500)}
function floatTxt(x,y,txt2){const e=document.createElement("div");e.className="float";e.textContent=txt2;e.style.left=(4+x*CS)+"px";e.style.top=(4+y*CS)+"px";$("board").append(e);setTimeout(()=>e.remove(),850)}
// clear a set of cells; specials in it fire too. made: cells that become new specials instead of going
async function clearCells(set,made){const q=[...set.keys()],done=new Set();let pts=0;
  while(q.length){const k=q.shift();if(done.has(k))continue;done.add(k);const[x,y]=k.split(",").map(Number),f=G.g[y][x];if(!f)continue;
    if(f.sp&&!(made&&made.has(k))){const add=[];
      if(f.sp==="h"){for(let i=0;i<N;i++)add.push([i,y]);fx("beam",4,4+y*CS+CS*0.3,CS*N,CS*0.4);sfx.zap()}
      if(f.sp==="v"){for(let i=0;i<N;i++)add.push([x,i]);fx("beam",4+x*CS+CS*0.3,4,CS*0.4,CS*N);sfx.zap()}
      if(f.sp==="w"){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)add.push([x+dx,y+dy]);fx("burst",4+(x-1)*CS,4+(y-1)*CS,CS*3,CS*3);sfx.boom()}
      if(f.sp==="b"){const tp=mostType();for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){const o=G.g[yy][xx];if(o&&o.t===tp)add.push([xx,yy])}sfx.zap()}
      add.forEach(([ax,ay])=>{if(inB(ax,ay)&&G.g[ay][ax]){const kk=ax+","+ay;if(!done.has(kk)){q.push(kk);set.set(kk,1)}}})}}
  for(const k of done){const[x,y]=k.split(",").map(Number),f=G.g[y][x];if(!f)continue;
    if(G.ice[y][x]>0){G.ice[y][x]--;G.iceLeft--;crackIce(x,y)}
    if(made&&made.has(k)){const m=made.get(k);f.sp=m.sp;if(m.sp==="b")f.t=-1;redraw(f);continue}
    if(f.t>=0)G.got[f.t]=(G.got[f.t]||0)+1;pts+=20;
    f.el.classList.add("pop");f.el.style.transform+=" scale(.2)";const el=f.el;setTimeout(()=>el.remove(),240);G.g[y][x]=null}
  return pts}
function mostType(){const c={};G.g.forEach(r=>r.forEach(f=>{if(f&&f.t>=0)c[f.t]=(c[f.t]||0)+1}));return +Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||0}
// one step: lines → clear (and make specials) → fall → refill
async function settle(moved){let chain=0;
  while(true){const runs=findRuns();if(!runs.length)break;chain++;
    const set=new Map(),made=new Map(),cnt={};
    runs.forEach(r=>r.c.forEach(([x,y])=>{const k=x+","+y;set.set(k,1);cnt[k]=(cnt[k]||0)+1}));
    // where a horizontal and a vertical line cross: a shiny fruit
    Object.keys(cnt).forEach(k=>{if(cnt[k]>1)made.set(k,{sp:"w"})});
    runs.forEach(r=>{if(r.c.length<4)return;if(r.c.some(([x,y])=>made.has(x+","+y)))return;
      let at=r.c.find(([x,y])=>moved&&moved.some(m=>m[0]===x&&m[1]===y))||r.c[1];const k=at[0]+","+at[1];
      made.set(k,{sp:r.c.length>=5?"b":(r.d==="h"?"v":"h")})});
    const pts=await clearCells(set,made);G.score+=pts*chain;
    const [fx0,fy0]=runs[0].c[Math.floor(runs[0].c.length/2)];floatTxt(fx0,fy0,"+"+num(pts*chain));
    sfx.pop(chain-1);if(made.size){vib(25);sfx.make()}
    if(chain===2){praise(t("p1"));sfx.cheer(0)}else if(chain===3){praise(t("p2"));sfx.cheer(1)}else if(chain===4){praise(t("p3"));sfx.cheer(2)}else if(chain>=5){praise(t("p4"));sfx.cheer(3)}
    hud();await wait(230);await fall();await wait(240);moved=null}
  return chain}
async function fall(){for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--){const f=G.g[y][x];if(f){if(w!==y){G.g[w][x]=f;G.g[y][x]=null;place(f,x,w)}w--}}
    let k=0;for(let y=w;y>=0;y--){k++;const f=newFruit(G.lv.types);G.g[y][x]=f;mkEl(f,x,y,-k)}}setTimeout(sfx.land,260)}
function praise(x){const e=document.createElement("div");e.className="praise";e.textContent=x;$("boardWrap").append(e);setTimeout(()=>e.remove(),1150)}

// ---------- the player's move ----------
async function trySwap(a,b){if(busy||G.over)return;busy=true;clearHint();const hand=boostMode==="hand";const A=G.g[a[1]][a[0]],B=G.g[b[1]][b[0]];if(!A||!B){busy=false;return}
  sfx.swap();swapCells(a,b);place(A,b[0],b[1]);place(B,a[0],a[1]);await wait(200);
  let ok=false;
  // special swaps: the rainbow star, or two specials together
  if(A.t<0||B.t<0||(A.sp&&B.sp)){ok=true;G.moves--;hud();await combo(A,B,b,a);await wait(200);await fall();await wait(240);await settle(null)}
  else if(hasLineAt()){ok=true;G.moves--;hud();await settle([a,b])}
  else if(hand){ok=true;boostMode=null;$("bHand").classList.remove("on");inv.hand--;saveInv();hud()}
  if(!ok){sfx.bad();swapCells(a,b);place(A,a[0],a[1]);place(B,b[0],b[1]);await wait(200);busy=false;idleHint();return}
  await afterMove();busy=false}
async function combo(A,B,pa,pb){const set=new Map(),add=(x,y)=>{if(inB(x,y)&&G.g[y][x])set.set(x+","+y,1)};
  if(A.t<0&&B.t<0){for(let y=0;y<N;y++)for(let x=0;x<N;x++)add(x,y);sfx.star();sfx.boom();fx("burst",4,4,CS*N,CS*N)}
  else if(A.t<0||B.t<0){sfx.star();const star=A.t<0?A:B,o=star===A?B:A,tp=o.t;add(...(star===A?pa:pb));
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=G.g[y][x];if(f&&f.t===tp){if(o.sp&&!f.sp){f.sp=o.sp==="w"?"w":(Math.random()<.5?"h":"v");redraw(f)}add(x,y)}}sfx.zap()}
  else{const[x,y]=pa,s1=A.sp,s2=B.sp;A.sp=null;B.sp=null;
    if((s1==="w")&&(s2==="w")){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)add(x+dx,y+dy);fx("burst",4+(x-2)*CS,4+(y-2)*CS,CS*5,CS*5);sfx.boom()}
    else if(s1==="w"||s2==="w"){for(let d=-1;d<=1;d++)for(let i=0;i<N;i++){add(i,y+d);add(x+d,i)}fx("beam",4,4+(y-1)*CS,CS*N,CS*3);fx("beam",4+(x-1)*CS,4,CS*3,CS*N);sfx.boom()}
    else{for(let i=0;i<N;i++){add(i,y);add(x,i)}fx("beam",4,4+y*CS+CS*.3,CS*N,CS*.4);fx("beam",4+x*CS+CS*.3,4,CS*.4,CS*N);sfx.zap()}}
  const pts=await clearCells(set,null);G.score+=pts;hud()}
async function afterMove(){hud();
  if(G.duel){duelScore();if(G.moves<=0){duelDone();return}if(!anyMove()){toast(t("shuffled"));await shuffle()}idleHint();return}
  if(goalsDone()){await finale();return}
  if(G.moves<=0){outOfMoves();return}
  if(!anyMove()){toast(t("shuffled"));await shuffle()}idleHint()}
async function shuffle(){const all=[];G.g.forEach(r=>r.forEach(f=>f&&all.push(f)));let tries=0;
  do{for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}let k=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++)G.g[y][x]=all[k++];tries++}while((hasLineAt()||!anyMove())&&tries<50);
  G.g.forEach((r,y)=>r.forEach((f,x)=>place(f,x,y)));await wait(260)}
// the level is won: every move left becomes a striped fruit that fires
async function finale(){G.over=true;praise(t("p4"));await wait(700);
  // up to 5 at a time, so a level with many moves left does not take long
  while(G.moves>0){const cand=[];G.g.forEach((r,y)=>r.forEach((f,x)=>{if(f&&f.t>=0&&!f.sp)cand.push([x,y])}));if(!cand.length)break;
    const set=new Map();for(let i=0;i<Math.min(5,G.moves)&&cand.length;i++){const[x,y]=cand.splice(Math.floor(Math.random()*cand.length),1)[0],f=G.g[y][x];f.sp=Math.random()<.5?"h":"v";redraw(f);G.moves--;G.score+=120;set.set(x+","+y,1);sfx.tap();await wait(70)}
    hud();await wait(150);G.score+=await clearCells(set,null);hud();await wait(180);await fall();await wait(200);await settle(null)}
  await wait(400);endLevel(true)}
function outOfMoves(){G.over=true;sfx.lose();const w=ov('<h2>'+t("lost")+'</h2><div class="wg"></div><button class="btn" type="button" id="m5">'+t("more5")+' · ١٠٠ 🪙</button><button class="btn blue" type="button" id="gu">'+t("giveUp")+'</button>');
  const wg=w.querySelector(".wg");G.lv.goals.forEach(g=>{const d=document.createElement("div"),left=goalLeft(g);d.className="goal"+(left<=0?" done":"");d.innerHTML=goalIcon(g)+'<span></span>';d.querySelector("span").textContent=left>0?num(left):"";wg.append(d)});
  w.querySelector("#m5").onclick=()=>spend(100,()=>{G.moves+=5;G.over=false;closeOv();hud();idleHint()});w.querySelector("#gu").onclick=()=>{closeOv();endLevel(false)}}
function endLevel(won,quit){clearHint();try{window.AG_played&&AG_played("fruit")}catch(e){}const n=G.n,lv=G.lv,score=G.score;G.over=true;
  if(won){const st=score>=lv.s3?3:score>=lv.s2?2:1;prog.st[n]=Math.max(prog.st[n]||0,st);if(n===prog.lv&&n<NL)prog.lv=n+1;saveProg();
    // a won level gives the heart back
    const h=hearts();if(h.n<HMAX){h.n++;if(h.n>=HMAX)h.t=0;ls("fr.h",JSON.stringify(h))}
    sfx.win();const w=ov('<h2>'+t("won")+'</h2><div class="stars3">'+[1,2,3].map(i=>'<span class="'+(i<=st?"on":"")+'">⭐</span>').join("")+'</div><b style="font-size:22px">'+t("score")+': '+num(score)+'</b>'+(n<NL?'<button class="btn" type="button" id="nx">'+t("next")+'</button>':"")+'<button class="btn blue" type="button" id="mp">'+t("map2")+'</button>');
    const nx=w.querySelector("#nx");if(nx)nx.onclick=()=>{closeOv();goHome();openLevel(n+1)};w.querySelector("#mp").onclick=()=>{closeOv();goHome()}}
  else{if(quit){goHome();return}const w=ov('<h2>'+t("lost")+'</h2><div style="font-size:60px">💔</div><button class="btn" type="button" id="rt">'+t("retry")+'</button><button class="btn blue" type="button" id="mp">'+t("map2")+'</button>');
    w.querySelector("#rt").onclick=()=>{closeOv();if(!useHeart()){goHome();noHearts();return}startLevel(n)};w.querySelector("#mp").onclick=()=>{closeOv();goHome()}}}
function goHome(){if(G&&G.duel){$("sbar").hidden=false}G=null;$("play").hidden=true;$("home").hidden=false;$("board").textContent="";drawMap.done=0;drawMap();paintBar();drawRank()}

// ---------- touch: drag a fruit onto its neighbour, or tap one and then the other ----------
let down=null;
function cellAt(e){const r=$("board").getBoundingClientRect(),x=Math.floor((e.clientX-r.left-4)/CS),y=Math.floor((e.clientY-r.top-4)/CS);return inB(x,y)?[x,y]:null}
$("board").addEventListener("pointerdown",e=>{if(!G||busy||G.over)return;const c=cellAt(e);if(!c)return;
  if(boostMode==="ham"){useHammer(c);return}
  down={c,x:e.clientX,y:e.clientY,done:false};try{$("board").setPointerCapture(e.pointerId)}catch(_){}});
$("board").addEventListener("pointermove",e=>{if(!down||down.done)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))<CS*0.35)return;
  down.done=true;const[x,y]=down.c,n=Math.abs(dx)>Math.abs(dy)?[x+(dx>0?1:-1),y]:[x,y+(dy>0?1:-1)];unsel();if(inB(...n))trySwap([x,y],n)});
$("board").addEventListener("pointerup",()=>{if(!down)return;const d=down;down=null;if(d.done)return;
  if(sel){const[sx,sy]=sel;if(Math.abs(sx-d.c[0])+Math.abs(sy-d.c[1])===1){const a=sel;unsel();trySwap(a,d.c);return}unsel()}
  sel=d.c;const f=G.g[sel[1]][sel[0]];if(f)f.el.classList.add("sel");sfx.tap()});
function unsel(){if(sel&&G){const f=G.g[sel[1]][sel[0]];if(f&&f.el)f.el.classList.remove("sel")}sel=null}
// hint after a few quiet seconds
function clearHint(){clearTimeout(hintT);document.querySelectorAll(".fr.hint").forEach(e=>e.classList.remove("hint"))}
function idleHint(){clearHint();hintT=setTimeout(()=>{if(!G||busy||G.over)return;const m=anyMove();if(m)m.forEach(([x,y])=>{const f=G.g[y][x];if(f&&f.el)f.el.classList.add("hint")})},6000)}
// boosters: one hammer and one shuffle in every level
$("bHam").onclick=()=>{if(!G||busy||G.over||!(G.boost.ham||inv.ham))return;boostMode=boostMode==="ham"?null:"ham";$("bHam").classList.toggle("on",!!boostMode);$("bHand").classList.remove("on");if(boostMode)toast(t("hammer"))};
async function useHammer(c){boostMode=null;$("bHam").classList.remove("on");if(G.boost.ham)G.boost.ham--;else{inv.ham--;saveInv()}busy=true;sfx.boom();fx("burst",4+c[0]*CS,4+c[1]*CS,CS,CS);
  G.score+=await clearCells(new Map([[c[0]+","+c[1],1]]),null);hud();await wait(200);await fall();await wait(240);await settle(null);await afterMove();busy=false}
$("bShuf").onclick=async()=>{if(!G||busy||G.over||!(G.boost.shuf||inv.shuf))return;if(G.boost.shuf)G.boost.shuf--;else{inv.shuf--;saveInv()}busy=true;await shuffle();await settle(null);hud();busy=false;idleHint()};
$("bHand").onclick=()=>{if(!G||busy||G.over||!inv.hand)return;boostMode=boostMode==="hand"?null:"hand";$("bHand").classList.toggle("on",boostMode==="hand");$("bHam").classList.remove("on");if(boostMode)toast(t("handOn"))};
addEventListener("resize",()=>{if(G)layout();else{drawMap.done=0;drawMap()}});

// ================= 🛒 the shop =================
// things for coins (boosters, hearts) are kept in my inventory; looks are bought with AG in the main shop
const SHOP=[
 {k:"inf1",ic:"♾️",cls:"pink",n:"inf1",p:500,give:()=>addInf(3600e3)},
 {k:"inf24",ic:"♾️",cls:"pink",n:"inf24",p:3000,rib:"🔥",give:()=>addInf(24*3600e3)},
 {k:"hearts",ic:"❤️",cls:"pink",n:"refill",p:200,give:()=>giveHearts(),label:1},
 {k:"ham",ic:"🔨",n:"bHam",d:"bHamD",p:150,give:()=>{inv.ham+=3}},
 {k:"shuf",ic:"🔀",n:"bShuf",d:"bShufD",p:100,give:()=>{inv.shuf+=3}},
 {k:"star",ic:"⭐",cls:"gold",n:"bStar",d:"bStarD",p:250,give:()=>{inv.star+=1}},
 {k:"sw",ic:"🍭",cls:"gold",n:"bSw",d:"bSwD",p:200,give:()=>{inv.sw+=1}},
 {k:"hand",ic:"🖐",n:"bHand",d:"bHandD",p:200,give:()=>{inv.hand+=2}}];
const today=()=>new Date().toISOString().slice(0,10);
function shopItem(o){const d=document.createElement("div");d.className="it";const have=o.k in inv&&typeof inv[o.k]==="number"&&o.k!=="inf"?inv[o.k]:0;
  d.innerHTML='<div class="ic '+(o.cls||"")+'"></div><b></b>'+(o.d?'<small></small>':"")+'<button class="buy" type="button"></button>';
  d.querySelector(".ic").textContent=o.ic;d.querySelector("b").textContent=o.label?"❤️ ×"+num(5):t(o.n);if(o.d)d.querySelector("small").textContent=t(o.d);
  if(have>0){const h=document.createElement("span");h.className="have";h.textContent="×"+num(have);d.append(h)}
  if(o.rib){const r=document.createElement("span");r.className="rib";r.textContent=o.rib;d.append(r)}
  const b=d.querySelector(".buy");b.textContent=num(o.p)+" 🪙";b.onclick=()=>spend(o.p,()=>{o.give();saveInv();sfx.win();toast(t("gotIt"));drawShop()});return d}
function drawShop(){const box=$("shop");if(!box||box.hidden)return;box.textContent="";
  const head=(k)=>{const h=document.createElement("div");h.className="sh-h";h.textContent=t(k);box.append(h)};
  const grid=()=>{const g=document.createElement("div");g.className="sh-g";box.append(g);return g};
  let g=grid();
  // the daily gift
  {const d=document.createElement("div");d.className="it wide";const done=inv.daily===today();d.innerHTML='<div class="ic gold">🎁</div><div class="tx"><b></b><small></small></div><button class="buy" type="button"></button>';
    d.querySelector("b").textContent=t("gift");d.querySelector("small").textContent=done?t("tomorrow"):t("giftD");const b=d.querySelector(".buy");b.textContent=done?"✔":t("take");if(done)b.className="buy used";
    else b.onclick=()=>{const r=Math.random();let msg;if(r<.3){inv.ham++;msg="🔨 ×١"}else if(r<.55){inv.shuf++;msg="🔀 ×١"}else if(r<.75){inv.hand++;msg="🖐 ×١"}else if(r<.9){inv.star++;msg="⭐ ×١"}else{addInf(30*60e3);msg="♾️ ٣٠ خ"}
      inv.daily=today();saveInv();sfx.win();toast("🎁 "+msg);drawShop()};g.append(d)}
  // the starter pack, once
  if(!inv.starter){const d=document.createElement("div");d.className="it wide";d.innerHTML='<div class="ic pink">🎁</div><div class="tx"><b></b><small></small></div><button class="buy" type="button"></button><span class="rib">-60%</span>';
    d.querySelector("b").textContent=t("starter");d.querySelector("small").textContent=t("starterD");const b=d.querySelector(".buy");b.textContent=num(600)+" 🪙";
    b.onclick=()=>spend(600,()=>{inv.ham+=5;inv.shuf+=5;inv.star+=3;addInf(2*3600e3);inv.starter=true;saveInv();sfx.win();toast(t("gotIt"));drawShop()});g.append(d)}
  head("secHearts");g=grid();SHOP.slice(0,3).forEach(o=>g.append(shopItem(o)));
  head("secBoost");g=grid();SHOP.slice(3).forEach(o=>g.append(shopItem(o)));
  // looks: bought with AG in the main shop; the ones I own can be chosen here
  if(window.M3SK){head("secLooks");g=grid();
    const look=(type,items,cur,prev)=>Object.keys(items).forEach(k=>{const it=items[k],mine=!it.price||owned[k],d=document.createElement("div");d.className="it";
      const pv=document.createElement("div");pv.className="lk";prev(k,pv);const nm=document.createElement("b");nm.textContent=it.name[LI()]||it.name[0];const b=document.createElement("button");b.type="button";
      if(cur===k){b.className="buy used";b.textContent=t("inUse")}else if(mine){b.className="buy";b.textContent=t("use");b.onclick=()=>setLook(type,k)}else{b.className="buy ag";b.textContent=num(it.price)+" AG";b.onclick=()=>{location.href="./#pack_"+type}}
      if(it.rare){const r=document.createElement("span");r.className="rib";r.textContent="✨";d.append(r)}d.append(pv,nm,b);g.append(d)});
    look("m3fruit",M3SK.sets,SKIN.f,(k,pv)=>{let h="";for(let i=0;i<6;i++)h+='<svg viewBox="0 0 100 100">'+M3SK.fruit(k,i)+'</svg>';pv.innerHTML=h});
    look("m3bg",M3SK.bgs,SKIN.bg,(k,pv)=>{pv.style.height="70px";const u=M3SK.bgUrl(k);if(u){pv.style.backgroundImage=u;pv.style.backgroundPosition="50% 22%"}});
    look("m3map",M3SK.maps,SKIN.map,(k,pv)=>{const m=M3SK.maps[k];if(m.bg)pv.style.background=m.bg;pv.style.fontSize="22px";pv.textContent=m.deco.slice(0,4).join(" ")})}}
async function setLook(type,k){const key={m3fruit:"f",m3bg:"bg",m3map:"map"}[type],def={m3fruit:"fs_classic",m3bg:"fb_green",m3map:"fm_spring"}[type];SKIN[key]=k;ls("fr.skin",JSON.stringify(SKIN));sfx.tap();
  if(fdb&&me)try{await fdb.ref("profiles/"+me+"/private/"+type).set(k===def?null:k)}catch(e){}drawMap.done=0;drawMap();drawShop()}

// ================= ⚔️ 1 vs 1 online =================
// m3duel/<code> = {host, status: wait | play | over, seed, startAt, round, p:{uid:{name,photo,score,left,done}}}
const D={code:null,ref:null,d:null};
const dNew=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s2="";for(let i=0;i<5;i++)s2+=a[Math.floor(Math.random()*a.length)];return s2};
const dMe=()=>({name:myName().slice(0,30),photo:myPhoto().length<1500?myPhoto():"",score:0,left:20,done:false});
function drawDuel(){const box=$("duel");if(box.hidden)return;box.textContent="";
  if(!fdb||!me){const p=document.createElement("p");p.className="hint2";p.textContent=t("login");box.append(p);return}
  const d=D.d;
  if(!D.code||!d){const c=document.createElement("div");c.className="card";c.innerHTML='<h2 style="margin:0"></h2><p style="margin:0;line-height:1.7"></p><button class="btn" type="button" id="dNew"></button><input id="dCode" maxlength="5" placeholder="ABCDE" autocomplete="off"><button class="btn blue" type="button" id="dJoin"></button>';
    c.querySelector("h2").textContent=t("duelT");c.querySelector("p").textContent=t("duelD");box.append(c);$("dNew").textContent=t("mkRoom");$("dJoin").textContent=t("joinR");
    $("dNew").onclick=dCreate;$("dJoin").onclick=()=>{const v=($("dCode").value||"").trim().toUpperCase();if(v.length===5)dJoin(v)};return}
  const ps=Object.entries(d.p||{}),c=document.createElement("div");c.className="card";
  const vs=document.createElement("div");vs.className="vs";
  const pl=(u,x)=>{const e=document.createElement("div");e.className="p";const im=document.createElement("img");im.alt="";im.src=face(x&&x.photo,x&&x.name);if(u)im.dataset.fr=u;const n=document.createElement("span");n.textContent=x?x.name:"…";e.append(im,n);return e};
  vs.append(pl(ps[0]&&ps[0][0],ps[0]&&ps[0][1]));const v=document.createElement("b");v.textContent="⚔️";vs.append(v,pl(ps[1]&&ps[1][0],ps[1]&&ps[1][1]));c.append(vs);
  if(d.status==="wait"){const k=document.createElement("div");k.className="dcode";k.textContent=D.code;c.append(k);
    if(ps.length<2){const sh=document.createElement("button");sh.className="btn blue";sh.type="button";sh.textContent=t("shareR");sh.onclick=dShare;const w=document.createElement("p");w.textContent=t("waitF");c.append(sh,w)}
    else if(d.host===me){const st=document.createElement("button");st.className="btn";st.type="button";st.textContent=t("startD");st.onclick=dStart;c.append(st)}
    else{const w=document.createElement("p");w.textContent=t("ready");c.append(w)}}
  else if(d.status==="over"){const mine=(d.p||{})[me]||{},oth=ps.find(([u])=>u!==me),os=oth?oth[1].score||0:0,ms=mine.score||0;
    const r=document.createElement("h2");r.style.margin="0";r.textContent=ms>os?t("dWin"):ms<os?t("dLose"):t("dDraw");const sc=document.createElement("p");sc.style.cssText="margin:0;font-size:20px;font-weight:900";sc.textContent=num(ms)+"  ⚔️  "+num(os);c.append(r,sc);
    if(d.host===me){const a=document.createElement("button");a.className="btn";a.type="button";a.textContent=t("again");a.onclick=dAgain;c.append(a)}}
  const lv=document.createElement("button");lv.className="btn red";lv.type="button";lv.textContent=t("leave");lv.onclick=dLeave;c.append(lv);box.append(c)}
async function dCreate(){const c=dNew();try{await fdb.ref("m3duel/"+c).set({host:me,status:"wait",createdAt:firebase.database.ServerValue.TIMESTAMP,round:0,p:{[me]:dMe()}});dOpen(c)}catch(e){toast("✖")}}
async function dJoin(c){try{const r=(await fdb.ref("m3duel/"+c).once("value")).val();if(!r){toast(t("noRoom"));return}const n=Object.keys(r.p||{}).length;if(n>=2&&!(r.p||{})[me]){toast(t("full"));return}
  await fdb.ref("m3duel/"+c+"/p/"+me).set(dMe());dOpen(c)}catch(e){toast("✖")}}
function dOpen(c){if(D.ref)D.ref.off();D.code=c;D.ref=fdb.ref("m3duel/"+c);D.ref.child("p/"+me+"/done").onDisconnect().set(true);
  D.ref.on("value",s=>{const prev=D.d;D.d=s.val();if(!D.d){D.code=null;D.ref.off();D.ref=null;if(G&&G.duel)goHome();toast(t("noRoom"));drawDuel();return}
    if(D.d.status==="play"&&(!prev||prev.status!=="play"||prev.round!==D.d.round))duelBegin();
    if(G&&G.duel)duelHud();
    if(D.d.status==="play"&&D.d.host===me){const ps=Object.values(D.d.p||{});if(ps.length>=2&&ps.every(x=>x.done))D.ref.update({status:"over"})}
    if(D.d.status==="over"&&prev&&prev.status==="play"){if(G&&G.duel){closeOv();goHome()}tab("duel");const mine=(D.d.p||{})[me]||{},o=Object.entries(D.d.p||{}).find(([u])=>u!==me);const os=o?o[1].score||0:0;(mine.score||0)>=os?sfx.win():sfx.lose()}
    drawDuel()})}
function dShare(){const x=t("title")+" ⚔️ "+D.code;if(navigator.share)navigator.share({title:t("title"),text:x,url:location.origin+location.pathname}).catch(()=>{});else{try{navigator.clipboard.writeText(x)}catch(e){}toast(t("copied"))}}
function dStart(){const d=D.d;if(!d||d.host!==me||Object.keys(d.p||{}).length<2)return;const up={status:"play",seed:Math.floor(Math.random()*1e9),startAt:Date.now()+3000,round:(d.round||0)+1};
  Object.keys(d.p).forEach(u=>{up["p/"+u+"/score"]=0;up["p/"+u+"/left"]=20;up["p/"+u+"/done"]=false});D.ref.update(up)}
function dAgain(){D.ref.update({status:"wait"})}
async function dLeave(){const d=D.d,c=D.code;if(D.ref){D.ref.child("p/"+me+"/done").onDisconnect().cancel();D.ref.off()}D.ref=null;D.code=null;D.d=null;
  try{if(d&&d.host===me)await fdb.ref("m3duel/"+c).remove();else await fdb.ref("m3duel/"+c+"/p/"+me).remove()}catch(e){}if(G&&G.duel)goHome();drawDuel()}
// the same board for both: the random numbers come from the room's seed
function duelBegin(){const d=D.d;closeOv();const lv={n:0,types:5,moves:20,goals:[],ice:[],s1:4000,s2:7000,s3:10000};
  G={lv,n:0,moves:20,score:0,got:{},iceLeft:0,boost:{ham:0,shuf:0},over:true,combo:0,duel:true,rnd:rng(d.seed)};G.ice=[...Array(N)].map(()=>Array(N).fill(0));
  $("home").hidden=true;$("play").hidden=false;$("board").textContent="";$("lvN").textContent="⚔️";$("sbar").hidden=true;
  G.g=fillStart();while(!anyMove())G.g=fillStart();
  requestAnimationFrame(()=>{drawCells();G.g.forEach((row,y)=>row.forEach((f,x)=>mkEl(f,x,y,y-N-1)));hud()});
  const wait2=Math.max(0,(d.startAt||0)-Date.now());praise(t("ready"));setTimeout(()=>{if(G&&G.duel){G.over=false;idleHint()}},Math.min(4000,wait2))}
function duelScore(){if(D.ref)D.ref.child("p/"+me).update({score:G.score,left:G.moves}).catch(()=>{})}
function duelDone(quit){if(!G||!G.duel)return;G.over=true;clearHint();if(D.ref)D.ref.child("p/"+me).update({score:G.score,left:0,done:true}).catch(()=>{});
  if(quit){goHome();tab("duel");return}ov('<h2>'+t("waitEnd")+'</h2><div style="font-size:50px">⏳</div><b style="font-size:22px">'+t("score")+': '+num(G.score)+'</b>')}
function duelHud(){const gb=$("goals");if(!gb||!D.d)return;gb.textContent="";const ps=D.d.p||{};const me2=ps[me]||{};const o=Object.entries(ps).find(([u])=>u!==me);
  const box=document.createElement("div");box.className="duelhud";const mk=(x,s2,lead)=>{const e=document.createElement("div");if(lead)e.className="lead";const im=document.createElement("img");im.alt="";im.src=face(x.photo,x.name);const b=document.createElement("b");b.textContent=num(s2);e.append(im,b);return e};
  const ms=G?G.score:me2.score||0,os=o?o[1].score||0:0;box.append(mk({name:myName(),photo:myPhoto()},ms,ms>os));if(o){const ol=document.createElement("small");ol.textContent="⚔️ "+num(o[1].left!=null?o[1].left:20);box.append(mk(o[1],os,os>ms),ol)}gb.append(box)}

fbBoot();txt();paintBar();
</script>
